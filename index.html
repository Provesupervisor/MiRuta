  let cuerpo;
  if(!progs.length){
    cuerpo=`<div class="titulo-p"><h1>Camiones del día</h1>${selectorDia(dia)}</div><div class="vacio"><div class="ic">${SVG.vacio}</div><b>No hay ruta para el ${esc(fechaLarga(dia))}</b>Cuando el supervisor guarde la programación en el planificador aparecerá aquí.<button class="btn osc" id="recargar">${SVG.recargar}Volver a buscar</button></div>`;
  }else{
    const items=[];let totP=0,totH=0,totF=0,totFH=0;
    progs.forEach(p=>p.unidades.forEach(u=>{
      const par=paradasDe(p,u);if(!par.length)return;
      const nf=par.reduce((a,s)=>a+s.peds.length,0);
      const fh=par.reduce((a,s)=>a+s.est.filter(e=>FINAL[e.estado]).length,0);
      const hechas=par.filter(s=>FINAL[s.estado]).length;
      totP+=par.length;totH+=hechas;totF+=nf;totFH+=fh;
      const pct=Math.round(hechas/par.length*100);
      const proc=par.find(s=>s.estado==='EN PROCESO');
      const sigP=par.find(s=>!FINAL[s.estado]&&s.estado!=='EN PROCESO');
      const fin=par.map(s=>s.est.map(e=>e.horaFin).filter(Boolean).sort().slice(-1)[0]).filter(Boolean).sort().slice(-1)[0];
      const linea=hechas===par.length?`<span class="ln c-TERMINADO">${SVG.check}Ruta terminada${fin?' a las '+horaCorta(fin):''}</span>`
        :proc?`<span class="ln c-EN_PROCESO"><i></i>En el cliente: <b>${esc(titulo(proc.peds[0].CLIENTES))}</b></span>`
        :hechas?`<span class="ln c-EN_RUTA">Va hacia: <b>${esc(titulo(sigP?sigP.peds[0].CLIENTES:''))}</b></span>`
        :`<span class="ln c-EN_RUTA">Aún sin atender</span>`;
      const actual=normPlaca(u.placa)===normPlaca(sel.placa)&&p.prog===sel.prog;
      const mio=permiso()!=='todo'&&esMio(u),soloVer=!puedoEditar(u);
      items.push(`<button class="unid${actual?' actual':''}${mio?' mio':''}" data-prog="${esc(p.prog)}" data-placa="${esc(u.placa)}"${actual?' aria-current="true"':''}>
        <div class="f1"><span class="placa">${esc(u.placa||'Sin placa')}</span><span class="chip${String(p.turno)==='2'?' t2':''}">${esc(titulo(p.turnoTxt))}</span>${mio?'<span class="chip tuyo">Tu camión</span>':soloVer&&permiso()==='asignado'?`<span class="chip lect">${SVG.candado}Ver</span>`:''}<span class="pct">${pct}%</span></div>
        <div class="ds">Ruta ${esc(u.ruta||'—')}${equipoTxt(u)?' · '+esc(equipoTxt(u)):''}</div>
        <div class="tira">${par.map(s=>`<span class="c-${EST[s.estado].cls}"></span>`).join('')}</div>
        <div class="cuenta"><span><b>${hechas}</b> de ${plural(par.length,'parada')} · ${fh}/${nf} facturas</span>${linea}</div></button>`);
    }));
    const pctT=totP?Math.round(totH/totP*100):0;
    const sinMio=permiso()==='asignado'&&!misUnidades().length;
    const nota=permiso()==='ver'?`<div class="aviso-p">${SVG.candado}<span><b>Usuario de consulta.</b> Puedes ver el avance de todos los camiones, sin modificarlo.</span></div>`
      :sinMio?`<div class="aviso-p">${SVG.candado}<span><b>Este día no tienes un camión asignado.</b> Puedes ver el avance de tus compañeros. Si debías salir en ruta, avisa al supervisor.</span></div>`:'';
    cuerpo=`<div class="titulo-p"><h1>${permiso()==='todo'&&dia===hoyLima()?'¿Qué camión manejas hoy?':'Camiones del día'}</h1>${selectorDia(dia)}<p>${permiso()==='asignado'?'Edita solo tu camión; los demás puedes verlos':'Toca un camión para ver su ruta'}</p></div>${nota}
      ${items.length>1?`<div class="avance-gral"><div class="anillo" style="--p:${pctT}"><b class="${pctT>=100?'largo':''}">${pctT}%</b></div><div class="tx"><b>${totH} de ${plural(totP,'parada')}</b><span>avance de todos los camiones · ${totFH}/${totF} facturas</span></div></div>`:''}
      ${items.join('')||'<div class="vacio">La programación no tiene camiones con facturas asignadas.</div>'}`;
  }
  app.innerHTML=barra({atras:desdeMas,tit:desdeMas?(permiso()==='todo'?'Cambiar de camión':'Camiones del día'):'Mi Ruta',sub:esc(ses.usuario)+(permiso()==='ver'?' · consulta':''),
      extra:desdeMas?'':`<button class="ib" id="bSalir" aria-label="Cerrar sesión">${SVG.salir}</button>`})+
    `<main class="pant">${cuerpo}${FIRMA}</main>`;
  app.querySelectorAll('.unid').forEach(b=>b.onclick=()=>{
    vibrar();sel.prog=b.dataset.prog;sel.placa=b.dataset.placa;guardar(K.sel,sel);filtro='pend';
    if(nav.pila.length)volverARaiz();else pintar('adelante');});
  const rc=document.getElementById('recargar');if(rc)rc.onclick=()=>cargar(null,false);
  const bs=document.getElementById('bSalir');if(bs)bs.onclick=pedirSalir;
  enlazarDia(dia);
  enlazarComun();
}
/* ---------- elegir el día (en la lista de camiones) ---------- */
function sumarDias(iso,n){const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function relDia(iso){const h=hoyLima();return iso===h?'Hoy':iso===sumarDias(h,-1)?'Ayer':iso===sumarDias(h,1)?'Mañana':'';}
function selectorDia(dia){
  const rel=relDia(dia);
  return `<div class="fecha-sel"><button class="fl" id="cAnt" aria-label="Día anterior">${SVG.chevI}</button>
    <label class="fecha-ch" title="Elegir otro día">${SVG.cal}<span>${rel?rel+', ':''}${esc(fechaLarga(dia))}</span><span class="bajar">▼</span><input type="date" id="cDia" value="${dia}" aria-label="Elegir el día"></label>
    <button class="fl" id="cSig" aria-label="Día siguiente">${SVG.chev}</button>${dia!==hoyLima()?'<button class="hoy" id="cHoy">Hoy</button>':''}</div>`;
}
function enlazarDia(dia){
  const ir=iso=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)||iso===dia)return;vibrar(8);
    sel.fechaDia=iso;sel.prog=null;guardar(K.sel,sel);datos=null;pintar('fundido');cargar(iso,false);};
  const a=document.getElementById('cAnt');if(a)a.onclick=()=>ir(sumarDias(dia,-1));
  const b=document.getElementById('cSig');if(b)b.onclick=()=>ir(sumarDias(dia,1));
  const c=document.getElementById('cDia');if(c)c.onchange=e=>ir(e.target.value);
  const h=document.getElementById('cHoy');if(h)h.onclick=()=>ir(hoyLima());
}

/* ---------- MI RUTA (pantalla principal) ---------- */
function pintarRuta(){
  const prog=progActual(),u=unidadActual(prog);
  const par=paradasDe(prog,u);
  const atendidas=par.filter(s=>FINAL[s.estado]).length;
  const nFac=par.reduce((a,s)=>a+s.peds.length,0);
  const enCurso=par.find(s=>s.estado==='EN PROCESO');
  const sig=enCurso||par.find(s=>!FINAL[s.estado]);
  const suyas=datos.programaciones.filter(p=>p.unidades.some(x=>normPlaca(x.placa)===normPlaca(u.placa)));
  const esHoy=prog.fechaDia===hoyLima();
  const pct=par.length?Math.round(atendidas/par.length*100):0;
  const rutaConf=par.some(s=>s.conf);
  const conOrden=par.filter(s=>s.orden).length;
  const conteo={};par.forEach(s=>s.est.forEach(e=>conteo[e.estado]=(conteo[e.estado]||0)+1));

  const hero=`<section class="hero">
    <div class="hero-f1"><span class="placa">${esc(u.placa||'Sin placa')}</span><span class="chip">Ruta ${esc(u.ruta||'—')}</span>${suyas.length>1?'':`<span class="chip">${esc(titulo(prog.turnoTxt))}</span>`}${esHoy?'':`<span class="chip dia">${esc(fechaLarga(prog.fechaDia))}</span>`}</div>
    ${equipoTxt(u)?`<div class="hero-sub">${esc(equipoTxt(u))}</div>`:''}
    ${suyas.length>1?`<div class="turnos" role="tablist">${suyas.map(p=>`<button data-tprog="${esc(p.prog)}" class="${p.prog===prog.prog?'on':''}" role="tab" aria-selected="${p.prog===prog.prog}">${esc(titulo(p.turnoTxt))}</button>`).join('')}</div>`:''}
    <div class="hero-av"><div class="anillo" style="--p:${pct}"><b class="${pct>=100?'largo':''}">${pct}%</b></div><div class="tx"><b>${atendidas} de ${par.length}</b><span>paradas atendidas · ${plural(nFac,'factura')}</span></div></div>
    <div class="tira" aria-hidden="true">${par.map(s=>`<span class="c-${EST[s.estado].cls}${s===sig?' actual':''}"></span>`).join('')}</div>
  </section>`;
  const editable=puedoEditar(u);
  const mio=misUnidades().find(x=>!(x.p.prog===prog.prog&&normPlaca(x.u.placa)===normPlaca(u.placa)));
  const lectura=editable?'':`<div class="lectura">${SVG.candado}<div><b>Solo lectura</b><span>${permiso()==='ver'?'Tu usuario es de consulta: puedes ver el avance, sin modificarlo.':'Esta ruta es de '+esc(equipoTxt(u)||'otro equipo')+'. Puedes ver su avance, pero no modificarla.'}</span></div>${mio?`<button class="btn mini osc" id="bMio" data-prog="${esc(mio.p.prog)}" data-placa="${esc(mio.u.placa)}">Ir a mi camión</button>`:''}</div>`;
  const ordenBox=!par.length?'':!editable?(rutaConf?`<div class="orden-ok">${SVG.candado}<span><b>Orden de visita confirmado.</b></span></div>`:''):rutaConf
    ?`<div class="orden-ok">${SVG.candado}<span><b>Orden de visita confirmado.</b> Solo el supervisor puede cambiarlo.</span></div>`
    :`<button class="orden-cta" id="btnOrdenar"><span class="ic">1·2·3</span><span><b>${conOrden?'Confirma tu orden de visita':'Ordena tu ruta'}</b><small>Indica en qué orden visitarás a tus ${par.length} clientes. Al confirmarlo queda fijo.</small></span>${SVG.chev}</button>`;
  const pend=par.filter(s=>!FINAL[s.estado]);
  const visibles=filtro==='pend'?pend:par;
  const leyenda=ORDEN_EST.filter(e=>conteo[e]).map(e=>`<span class="c-${EST[e].cls}"><i></i>${conteo[e]} ${TXT_EST[e].toLowerCase()}</span>`).join('');
  let lista;
  if(!par.length)lista=`<div class="vacio"><div class="ic">${SVG.vacio}</div><b>Este camión no tiene facturas</b>Revisa con el supervisor o cambia de camión en Más.</div>`;
  else if(!visibles.length)lista=`<div class="vacio"><div class="ic" style="color:var(--term-f)">${SVG.check}</div><b>¡Ruta completa!</b>Todas las paradas tienen estado final. Revisa el detalle en "Todas".</div>`;
  else lista=`<div class="tl${editable?'':' ro'}">${visibles.map(s=>tarjeta(s,s===sig,par.indexOf(s),editable)).join('')}</div>`;

  app.innerHTML=barra({tit:'Mi Ruta',sub:esc(u.placa)+' · '+esc(titulo(prog.turnoTxt))})+
    `<main class="pant">${hero}<div style="height:12px"></div>${lectura}${ordenBox}
     <div class="seg" role="tablist"><button data-f="pend" class="${filtro==='pend'?'on':''}">Por atender<span>${pend.length}</span></button><button data-f="todas" class="${filtro!=='pend'?'on':''}">Todas<span>${par.length}</span></button></div>
     <div class="conteos">${leyenda}</div>
     ${lista}${FIRMA}</main>`+barraTabs();

  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filtro=b.dataset.f;pintar();});
  app.querySelectorAll('[data-tprog]').forEach(b=>b.onclick=()=>{sel.prog=b.dataset.tprog;guardar(K.sel,sel);vibrar(8);pintar('fundido');});
  if(editable)app.querySelectorAll('[data-fac]').forEach(b=>b.onclick=()=>{const s=par[+b.dataset.par];abrirHoja(prog,u,s,s.peds[+b.dataset.fac]);});
  enlazarNovedades(prog,u,par);
  const bm=document.getElementById('bMio');if(bm)bm.onclick=()=>{vibrar(8);sel.prog=bm.dataset.prog;sel.placa=bm.dataset.placa;guardar(K.sel,sel);filtro='pend';pintar('fundido');};
  enlazarAcciones(prog,u,par);
  const bo=document.getElementById('btnOrdenar');if(bo)bo.onclick=()=>empezarOrdenar(prog,u);
  enlazarComun();
}
/* tarjeta de una parada, como en la versión anterior: facturas y botones a la vista */
function tarjeta(s,esSig,idx,editable){
  if(editable===undefined)editable=true;
  const p0=s.peds[0];
  const final=FINAL[s.estado];
  const compacta=final&&!esSig;
  const tipo=String(p0.TIPO||'').toUpperCase();
  const tipoCls=/PROV/.test(tipo)?'PROVINCIA':/RETIRO|RECOJ/.test(tipo)?'RETIRO':/LOCAL/.test(tipo)?'LOCAL':'';
  const comp=s.peds.reduce((a,p)=>a+(+p.comp||0),0),part=s.peds.reduce((a,p)=>a+(+p.partes||0),0);
  const obs=[...new Set(s.peds.map(p=>String(p.OBSERVACION||'').trim()).filter(Boolean))];
  const pr=progActual();
  const sinFoto=faltanFotos(pr,s).length,nFotos=fotosParada(pr,s).length;
  const facs=s.peds.map((p,i)=>{const e=s.est[i];
    return `<${editable?'button':'div'} class="facb" data-par="${idx}" data-fac="${i}"${editable?` aria-label="Cambiar estado de la factura ${esc(p.FACTURA||'sin número')}"`:''}>
      <span class="fac-n"><span class="fac-num">${esc(p.FACTURA||'Sin número de factura')}</span>${e.pend?'<span class="pend-dot" title="Por enviar"></span>':''}${fotoBadge(pr,p,e.estado)}
        ${e.estado==='ANULADO'&&e.motivo?`<small style="color:var(--anul)">Motivo: ${esc(e.motivo)}</small>`:''}
        ${e.estado==='ENTREGA PARCIAL'&&e.detalle?`<small style="color:var(--parc)">Rechazado: ${esc(e.detalle)}</small>`:''}</span>
      ${estHtml(e.estado)}${editable?'<span class="flecha" aria-hidden="true">›</span></button>':'</div>'}`;}).join('');
  const porHora=(x,y)=>horaCorta(x).localeCompare(horaCorta(y));
  const lleg=s.est.map(e=>e.horaLlegada).filter(Boolean).sort(porHora)[0];
  const fin=s.est.map(e=>e.horaFin).filter(Boolean).sort(porHora).slice(-1)[0];
  let horas='';
  if(lleg||fin){
    const dur=lleg&&fin&&!String(lleg).startsWith('~')&&!String(fin).startsWith('~')?minutos(lleg,fin):null;
    horas=`<span class="hrs">${lleg?'Llegó '+horaCorta(lleg):''}${lleg&&fin?' · ':''}${fin?'terminó '+horaCorta(fin):''}${dur!=null&&dur>=0?' ('+dur+' min en el cliente)':''}</span>`;
  }
  const novs=novedadesDe(progActual(),s);
  const yo=String(ses&&ses.usuario||'').toLowerCase(),adm=permiso()==='todo';
  const novHtml=novs.length?`<div class="novs">${novs.map(n=>{const mia=adm||String(n.usuario||'').toLowerCase()===yo;
    return `<${editable&&mia?'button':'div'} class="nov"${editable&&mia?` data-novq="${idx}" data-novid="${esc(n.id)}" aria-label="Novedad: ${esc(n.tipo)}. Tocar para quitarla"`:''}>
      <span class="nov-ic">${ICO_NOV[novInfo(n.tipo).i]}</span><span class="nov-tx"><b>${esc(novInfo(n.tipo).l)}</b>
      <small>${esc(n.detalle)}</small><em>${n.minutos?`<span class="nov-min-c">${n.minutos} min de espera</span>`:''}${esc(horaCorta(n.hora))}${n.nombre?' · '+esc(titulo(String(n.nombre).split(/\s+/).slice(0,2).join(' '))):''}${n.pend?' · por enviar':''}</em></span>${n.pend?'<span class="pend-dot" title="Por enviar"></span>':''}</${editable&&mia?'button':'div'}>`;}).join('')}</div>`:'';
  const btnNov=editable?`<button class="nov-btn" data-nov="${idx}" aria-label="Registrar una novedad en esta parada">${SVG.bandera}<span>Novedad</span>${novs.length?`<i>${novs.length}</i>`:''}</button>`:'';
  const btnFoto=editable&&nFotos?`<button class="nov-btn foto-btn" data-foto="${idx}" aria-label="Ver o cambiar la foto de la guía firmada">${SVG.camara}<span>Foto</span><i>${nFotos}</i></button>`:'';
  /* por atender: Novedad arriba, junto al cliente · ya entregada: abajo, junto a Foto */
  const btnsPie=btnFoto||(final&&btnNov)?`<span class="t-acc-btns">${btnFoto}${final?btnNov:''}</span>`:'';
  const hayRuta=s.est.some(e=>e.estado==='EN RUTA');
  const hayProc=s.est.some(e=>e.estado==='EN PROCESO');
  let acc='';
  if(!final&&editable){
    if(hayProc)acc=`<div class="acc">${btnMapa(p0,false)}<button class="btn entregado" data-entregado="${esc(s.key)}">${SVG.check}Entregado completo</button></div>`;
    else if(hayRuta)acc=`<div class="acc">${btnMapa(p0,false)}<button class="btn llegue" data-llegue="${esc(s.key)}">Llegué al cliente</button></div>`;
  }
  return `<div class="parada c-${EST[s.estado].cls}${esSig?' siguiente':''}${compacta?' compacta':''}">
    <div class="num${s.orden?'':' sin-orden'}" aria-label="${s.orden?'Orden de visita '+s.orden:'Sin orden de visita, programado '+s.n}">${s.orden||s.n}</div>
    <div class="tarjeta">
      <div class="t-cab"><div class="t-cab-tx">
        ${esSig?`<span class="etq-sig">${s.estado==='EN PROCESO'?'Atendiendo ahora':'Siguiente parada'}</span>`:''}
        <div class="cli">${esc(titulo(p0.CLIENTES)||'Cliente sin nombre')}</div></div>${final?'':btnNov}</div>
      <div class="meta">${esc(titulo(p0.DISTRITO))}${s.orden&&s.orden!==s.n?`<span class="prog-n" title="Orden en que lo programó el supervisor">prog. ${s.n}</span>`:''}${tipoCls?`<span class="ch ${tipoCls}">${esc(titulo(tipoCls))}</span>`:''}${!compacta&&(comp||part)?` · ${comp} compl. + ${part} partes`:''}</div>
      ${!compacta&&obs.length?`<div class="nota">${obs.map(esc).join('<br>')}</div>`:''}
      <div class="facs">${facs}</div>${novHtml}${horas||btnsPie?`<div class="t-pie">${horas||'<span></span>'}${btnsPie}</div>`:''}${acc}
    </div></div>`;
}
function btnMapa(p0,corto){
  const destino=p0.lat&&p0.lng?`${p0.lat},${p0.lng}`:encodeURIComponent((p0.CLIENTES||'')+' '+(p0.DISTRITO||'')+' Lima');
  return `<a class="btn${corto?' sec':''}" href="https://www.google.com/maps/dir/?api=1&destination=${destino}" target="_blank" rel="noopener" aria-label="Cómo llegar">${SVG.mapa}${corto?'':'<span class="txt">Cómo llegar</span>'}</a>`;
}
/* botones "Llegué al cliente" y "Entregado" (en la tarjeta principal y en el detalle) */
function enlazarAcciones(prog,u,par){
  const deKey=k=>par.find(s=>s.key===k);
  app.querySelectorAll('[data-llegue]').forEach(b=>b.onclick=()=>{
    const s=deKey(b.dataset.llegue);if(!s)return;
    const peds=s.peds.filter((p,i)=>s.est[i].estado==='EN RUTA');
    vibrar(18);registrar(prog,u,peds,'EN PROCESO','','',true);});
  app.querySelectorAll('[data-entregado]').forEach(b=>b.onclick=()=>{
    const s=deKey(b.dataset.entregado);if(!s)return;
    const peds=s.peds.filter((p,i)=>!FINAL[s.est[i].estado]);
    vibrar(sinFotoPara(prog,peds,'TERMINADO').length?10:[18,40,18]);
    registrar(prog,u,peds,'TERMINADO','','',true);   // sin foto, abre primero la cámara
  });
}

/* ---------- RESUMEN del día ---------- */
function pintarResumen(){
  const prog=progActual(),u=unidadActual(prog);
  const par=paradasDe(prog,u);
  const todos=par.flatMap(s=>s.est.map((e,i)=>({e,p:s.peds[i],s})));
  const c={};ORDEN_EST.forEach(x=>c[x]=0);todos.forEach(x=>c[x.e.estado]++);
  const n=todos.length,hechas=todos.filter(x=>FINAL[x.e.estado]).length,pct=n?Math.round(hechas/n*100):0;
  const reales=x=>x&&!String(x).startsWith('~');
  const lls=par.map(s=>s.est.map(e=>e.horaLlegada).filter(reales).sort()[0]).filter(Boolean).sort();
  const fns=par.map(s=>s.est.map(e=>e.horaFin).filter(reales).sort().slice(-1)[0]).filter(Boolean).sort();
  const durs=par.map(s=>{const a=s.est.map(e=>e.horaLlegada).filter(reales).sort()[0],b=s.est.map(e=>e.horaFin).filter(reales).sort().slice(-1)[0];return a&&b&&FINAL[s.estado]?minutos(a,b):null;}).filter(x=>x!=null&&x>=0);
  const prom=durs.length?Math.round(durs.reduce((a,b)=>a+b,0)/durs.length):null;
  const nov=todos.filter(x=>x.e.estado==='ANULADO'||x.e.estado==='ENTREGA PARCIAL');
  const reqF=todos.filter(x=>NECESITA_FOTO[x.e.estado]);
  const conF=reqF.filter(x=>fotosDe(claveDe(prog.prog,x.p)).length).length;
  const fPend=fotoCola.filter(f=>f.prog===prog.prog).length;
  const sinF=par.filter(s=>faltanFotos(prog,s).length),edit=puedoEditar(u);
  const fotosSec=`<section class="bloque"><h2>Fotos de guías firmadas</h2><div class="metricas">
      <div><small>Guías con foto</small><b>${conF} / ${reqF.length}</b></div>
      <div><small>Fotos por enviar</small><b>${fPend}</b></div></div>
      ${sinF.map(s=>{const f=faltanFotos(prog,s);const tag=edit?'button':'div';

async function pedirSalir(){

}
function cerrarSesion(msg){
  const u=ses&&ses.usuario;ses=null;
  try{localStorage.removeItem(K.ses);}catch(e){}
  if(u)guardar('ruta_ultimo_usuario',u);

/* =====================================================================
   ORDENAR MI RUTA: el chofer toca a sus clientes en el orden en que los
   visitará. El primero que toca es el 1, el siguiente el 2, y así.
   Tocar uno ya numerado le quita el número y los siguientes se recorren.
   ===================================================================== */
let ordenando=null;     // {prog, placa, lista:[key de parada]}
function empezarOrdenar(prog,u){
  if(!puedoEditar(u)){toast('Esta ruta es de otro equipo: solo puedes verla.',true);return;}
  const par=paradasDe(prog,u);
  if(par.some(s=>s.conf)){toast('El orden ya fue confirmado. Solo el supervisor puede cambiarlo.',true);return;}
  ordenando={prog:prog.prog,placa:u.placa,lista:par.filter(s=>s.orden).sort((a,b)=>a.orden-b.orden).map(s=>s.key)};
  irA('ordenar');
}
function pintarOrdenar(){
  const prog=progActual(),u=unidadActual(prog);
  if(!ordenando||!prog||!u||ordenando.prog!==prog.prog||normPlaca(ordenando.placa)!==normPlaca(u.placa)){nav.pila.pop();ordenando=null;return pintar();}
  const par=paradasDe(prog,u);
  if(par.some(s=>s.conf)){toast('El orden ya fue confirmado. Solo el supervisor puede cambiarlo.',true);ordenando=null;setTimeout(atras,0);return pintarRutaSinPila();}
  const lista=ordenando.lista.filter(k=>par.some(s=>s.key===k));
  ordenando.lista=lista;
  const porPrograma=par.slice().sort((a,b)=>a.n-b.n);
  const items=porPrograma.map(s=>{
    const i=lista.indexOf(s.key);const p0=s.peds[0];
    return `<button class="ord-item${i>=0?' on':''}" data-ok="${esc(s.key)}" aria-pressed="${i>=0}">
      <span class="ord-num">${i>=0?i+1:''}</span>
      <span class="tx"><b>${esc(titulo(p0.CLIENTES)||'Cliente sin nombre')}</b>
        <small>${esc(titulo(p0.DISTRITO))} · prog. ${s.n} · ${plural(s.peds.length,'factura')}</small></span>
      ${s.estado!=='EN RUTA'?estHtml(s.estado):''}</button>`;}).join('');
  const faltan=par.length-lista.length;
  app.innerHTML=barra({atras:true,tit:'Ordenar mi ruta',sub:esc(u.placa)+' · '+lista.length+' de '+par.length+' numerados',sinSync:true,
      extra:lista.length?`<button class="ib" id="ordLimpiar" aria-label="Empezar de nuevo">${SVG.recargar}</button>`:''})+
    `<main class="pant"><div class="ord-ayuda"><b>Toca a tus clientes en el orden en que los visitarás</b>El primero que toques será el 1, el siguiente el 2, y así. Si te equivocas, tócalo otra vez para quitarle el número. Al confirmar queda fijo: solo el supervisor podrá cambiarlo.</div>
     <div class="ord-lista">${items}</div>${FIRMA}</main>
     <div class="pie"><div class="pie-in"><button class="btn pri" id="ordOk">${SVG.check}${faltan&&lista.length?'Confirmar orden ('+lista.length+' de '+par.length+')':'Confirmar orden'}</button></div></div>`;
  document.body.classList.add('con-pie');
  app.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ok,i=ordenando.lista.indexOf(k);
    if(i>=0)ordenando.lista.splice(i,1);else ordenando.lista.push(k);
    vibrar(8);pintar();
  });
  const bl=document.getElementById('ordLimpiar');if(bl)bl.onclick=()=>{ordenando.lista=[];pintar();};
  document.getElementById('ordOk').onclick=()=>guardarOrden(prog,u,par);
  const a=document.getElementById('bAtras');if(a)a.onclick=atras;
}
function pintarRutaSinPila(){nav.pila=nav.pila.filter(x=>x.v!=='ordenar');pintar();}
async function guardarOrden(prog,u,par){
  let lista=ordenando.lista.slice();
  if(!lista.length){toast('Toca a tus clientes en el orden en que los visitarás.',true);return;}
  const resto=par.filter(s=>!lista.includes(s.key)).sort((a,b)=>a.n-b.n);
  const ok=await dialogo('¿Confirmar este orden?',(resto.length?'Te faltan '+plural(resto.length,'cliente')+' por numerar: irán al final, en el orden que programó el supervisor.\n\n':'')+'Una vez confirmado queda fijo: solo el supervisor podrá cambiarlo.','Confirmar','Revisar');
  if(!ok||!ordenando)return;
  lista=lista.concat(resto.map(s=>s.key));
  /* se envían TODAS las facturas con la confirmación, aunque su número no cambie:
     así cada una queda marcada como confirmada en la hoja */
  const ts=Date.now();
  lista.forEach((k,i)=>{
    const s=par.find(x=>x.key===k);if(!s)return;
    s.peds.forEach(p=>cola.push(Object.assign(datosCambio(prog,u,p,ts),{soloOrden:true,orden:i+1,confirmar:true})));
  });
  ordenando=null;
  guardar(K.cola,cola);programarEnvio(300);
  filtro='pend';vibrar([18,40,18]);
  volverARaiz();
  toast('Orden de visita confirmado');
}

/* ---------- hoja inferior: cambiar el estado de una factura ---------- */
let hojaCtx=null;
function abrirHoja(prog,u,s,p){
  const e=estadoDe(claveDe(prog.prog,p));
  hojaCtx={prog,u,s,p,actual:e.estado,elegido:null,motivo:e.estado==='ANULADO'?e.motivo||'':'',detalle:e.estado==='ENTREGA PARCIAL'?e.detalle||'':'',todas:false};
  pintarHoja();
  history.pushState({hoja:1},'');
  document.getElementById('velo').classList.add('on');
  requestAnimationFrame(()=>document.getElementById('hoja').classList.remove('cerrada'));
  setTimeout(()=>{const b=document.querySelector('#hoja .opc');if(b)b.focus();},240);
}
/* desdePop: la cerró el botón atrás del celular (el historial ya retrocedió) */
function cerrarHoja(desdePop){
  if(!hojaCtx)return;
  if(hojaCtx.modo==='foto'&&hojaCtx.pend)toast('Sin la foto de la guía no se marca la entrega.',true);
  document.getElementById('hoja').classList.add('cerrada');
  document.getElementById('velo').classList.remove('on');
  hojaCtx=null;
  if(!desdePop){saltarPop++;history.back();}
}
function pintarHoja(){
  if(hojaCtx&&hojaCtx.modo==='nov')return pintarHojaNov();
  if(hojaCtx&&hojaCtx.modo==='foto')return pintarHojaFoto();
  const h=hojaCtx,el=document.getElementById('hoja');
  const otras=h.s.peds.length>1;
  const ops=ORDEN_EST.map(e=>`<button class="opc c-${EST[e].cls}${e===h.actual?' actual':''}${e===h.elegido?' marcada':''}" data-op="${esc(e)}">
      <span class="oi">${ICO_EST[e]}</span><span><b>${TXT_EST[e]}</b><small>${esc(EST[e].d)}${NECESITA_FOTO[e]&&fotoObligatoria()?' · con foto de la guía':''}</small></span></button>`).join('');
  let extra='';
  if(h.elegido==='ANULADO'){
    extra=`<div class="campo"><label for="hMot">Motivo de la anulación <em>(obligatorio)</em></label>
      <div class="rapidos">${MOTIVOS.map(m=>`<button data-mot="${esc(m)}">${esc(m)}</button>`).join('')}</div>
      <textarea id="hMot" maxlength="500" placeholder="Escribe por qué se anula el envío">${esc(h.motivo)}</textarea></div>`;
  }else if(h.elegido==='ENTREGA PARCIAL'){
    extra=`<div class="campo"><label for="hDet">¿Qué se rechazó? <em>(opcional)</em></label>
      <textarea id="hDet" maxlength="500" placeholder="Ej. 2 sillas con el tapiz rasgado">${esc(h.detalle)}</textarea></div>`;
  }
  const necesitaGuardar=h.elegido==='ANULADO'||h.elegido==='ENTREGA PARCIAL';
  el.innerHTML=`<div class="hoja-top"><button type="button" class="asa-btn" data-cerrar aria-label="Cerrar (o desliza hacia abajo)"><span class="asa"></span></button><button type="button" class="hoja-x" data-cerrar aria-label="Cerrar">✕</button></div><h3 id="hojaTit">Factura ${esc(h.p.FACTURA||'sin número')}</h3>
    <div class="sub">${esc(titulo(h.p.CLIENTES))} · parada ${h.s.orden||h.s.n}</div>
    <div class="opciones">${ops}</div>${extra}
    ${otras?`<label class="todas"><input type="checkbox" id="hTodas" ${h.todas?'checked':''}> Aplicar a las ${h.s.peds.length} facturas de esta parada</label>`:''}
    ${necesitaGuardar?`<button class="btn-guardar" id="hOk">Guardar ${esc(TXT_EST[h.elegido].toLowerCase())}</button>`:''}
    <button class="nov-link foto-link" id="hFoto">${SVG.camara}<span><b>Foto de la guía firmada</b><small>${(()=>{const n=fotosDePeds(h.prog,[h.p]).length;return n?plural(n,'foto')+' en esta factura':'Evidencia para el asesor';})()}</small></span>${SVG.chev}</button>
    <button class="nov-link" id="hNov">${SVG.bandera}<span><b>Registrar una novedad</b><small>Demora del cliente, cambio de dirección, sin respuesta…</small></span>${SVG.chev}</button>
    <button class="btn-sec" id="hNo">Cancelar</button>`;
  el.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>elegir(b.dataset.op));
  el.querySelectorAll('[data-mot]').forEach(b=>b.onclick=()=>{
    const t=document.getElementById('hMot');t.value=t.value.trim()?t.value.trim()+'. '+b.dataset.mot:b.dataset.mot;h.motivo=t.value;t.classList.remove('falta');});
  const tm=document.getElementById('hMot');if(tm)tm.oninput=()=>{h.motivo=tm.value;tm.classList.remove('falta');};
  const td=document.getElementById('hDet');if(td)td.oninput=()=>{h.detalle=td.value;};
  const tt=document.getElementById('hTodas');if(tt)tt.onchange=()=>{h.todas=tt.checked;};
  const ok=document.getElementById('hOk');if(ok)ok.onclick=confirmarHoja;
  document.getElementById('hNo').onclick=()=>cerrarHoja();
  const hf=document.getElementById('hFoto');if(hf)hf.onclick=()=>{const c=hojaCtx;abrirFotos(c.prog,c.u,c.s);};
  const hn=document.getElementById('hNov');if(hn)hn.onclick=()=>{const c=hojaCtx;hojaCtx=Object.assign({},{modo:'nov',prog:c.prog,u:c.u,s:c.s,tipo:null,detalle:'',minutos:0});pintarHoja();};
}
/* ---------- hoja inferior: registrar una NOVEDAD en la parada ---------- */

function abrirNovedad(prog,u,s){
  hojaCtx={modo:'nov',prog,u,s,tipo:null,detalle:'',minutos:0};
  pintarHoja();
  history.pushState({hoja:1},'');
  document.getElementById('velo').classList.add('on');
  requestAnimationFrame(()=>document.getElementById('hoja').classList.remove('cerrada'));
}
/* minutos desde que llegó (si marcó "Llegué"): sugiere la espera */
function esperaSugerida(prog,s){
  const ll=s.est.map(e=>e.horaLlegada).filter(Boolean).map(h=>String(h).startsWith('~')?null:Date.parse(String(h).replace(' ','T')+'-05:00')).filter(Boolean).sort()[0];
  if(!ll)return 0;const m=Math.round((Date.now()-ll)/60000);return m>=15&&m<=600?m:0;
}
function pintarHojaNov(){
  const h=hojaCtx,el=document.getElementById('hoja');
  const ops=NOVEDADES.map(n=>`<button class="opc nov-op${n.t===h.tipo?' marcada':''}" data-nt="${esc(n.t)}"><span class="oi">${ICO_NOV[n.i]}</span><span><b>${esc(n.l)}</b><small>${esc(n.d)}</small></span></button>`).join('');
  const sel=NOVEDADES.find(n=>n.t===h.tipo);
  const espera=h.tipo==='Sobrepasa el limite de tiempo de espera';
  const extra=!sel?'':`
    ${espera?`<div class="campo"><label>¿Cuánto esperaron? <em>(minutos)</em></label>
      <div class="rapidos">${[20,30,45,60,90].map(m=>`<button data-min="${m}" class="${+h.minutos===m?'on':''}">${m===90?'+60':m} min</button>`).join('')}</div>
      <input type="number" id="nMin" inputmode="numeric" min="15" max="600" value="${h.minutos||''}" placeholder="Minutos de espera" class="nov-min"></div>`:''}
    <div class="campo"><label for="nDet">Explica brevemente qué pasó <em>(obligatorio)</em></label>
      <textarea id="nDet" maxlength="500" placeholder="${esc(sel.ej)}">${esc(h.detalle)}</textarea></div>
    <button class="btn-guardar" id="nOk">Registrar novedad</button>`;
  el.innerHTML=`<div class="hoja-top"><button type="button" class="asa-btn" data-cerrar aria-label="Cerrar (o desliza hacia abajo)"><span class="asa"></span></button><button type="button" class="hoja-x" data-cerrar aria-label="Cerrar">✕</button></div><h3 id="hojaTit">Registrar novedad</h3>
    <div class="sub">${esc(titulo(h.s.peds[0].CLIENTES))} · parada ${h.s.orden||h.s.n}${h.s.peds.length>1?' · '+h.s.peds.length+' facturas':''}</div>
    <p class="nov-ayuda">${sel?'Novedad elegida. Agrega el detalle y regístrala.':'Elige la novedad. Aunque la entrega se haya hecho, regístrala si pasó.'}</p>
    <div class="opciones${sel?' elegida':''}">${sel?`<button class="opc nov-op marcada" data-nt=""><span class="oi">${ICO_NOV[sel.i]}</span><span><b>${esc(sel.l)}</b><small>Tocar para cambiar</small></span></button>`:ops}</div>${extra}
    <button class="btn-sec" id="hNo">Cancelar</button>`;
  el.querySelectorAll('[data-nt]').forEach(b=>b.onclick=()=>{h.tipo=b.dataset.nt||null;
    if(h.tipo==='Sobrepasa el limite de tiempo de espera'&&!h.minutos)h.minutos=esperaSugerida(h.prog,h.s);
    pintarHoja();const t=document.getElementById(h.tipo==='Sobrepasa el limite de tiempo de espera'&&!h.minutos?'nMin':'nDet');if(t)t.focus();});
  el.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{h.minutos=+b.dataset.min;pintarHoja();const t=document.getElementById('nDet');if(t)t.focus();});
  const nm=document.getElementById('nMin');if(nm)nm.oninput=()=>{h.minutos=+nm.value||0;};
  const nd=document.getElementById('nDet');if(nd)nd.oninput=()=>{h.detalle=nd.value;nd.classList.remove('falta');};
  const ok=document.getElementById('nOk');if(ok)ok.onclick=()=>{
    const det=String(h.detalle||'').trim();
    if(det.length<3){const t=document.getElementById('nDet');t.classList.add('falta');t.focus();toast('Explica brevemente qué pasó.',true);vibrar([30,40,30]);return;}
    const c=h;cerrarHoja();vibrar(18);registrarNovedad(c.prog,c.u,c.s,c.tipo,det,espera?c.minutos:0);};
  document.getElementById('hNo').onclick=()=>cerrarHoja();
}
function enlazarNovedades(prog,u,par){
  app.querySelectorAll('[data-foto]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();vibrar(8);abrirFotos(prog,u,par[+b.dataset.foto]);});
  app.querySelectorAll('[data-nov]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();vibrar(8);abrirNovedad(prog,u,par[+b.dataset.nov]);});
  app.querySelectorAll('[data-novq]').forEach(b=>b.onclick=async()=>{
    const s=par[+b.dataset.novq];const n=novedadesDe(prog,s).find(x=>String(x.id)===b.dataset.novid);if(!n)return;
    if(await dialogo('¿Quitar esta novedad?',novInfo(n.tipo).l+': '+n.detalle,'Quitar','Dejarla'))quitarNovedad(prog,u,s,n);});
}
function elegir(e){
  const h=hojaCtx;
  if(e==='ANULADO'||e==='ENTREGA PARCIAL'){
    h.elegido=e;pintarHoja();
    const t=document.getElementById(e==='ANULADO'?'hMot':'hDet');if(t)t.focus();
    return;
  }
  h.elegido=e;confirmarHoja();
}
function confirmarHoja(){
  const h=hojaCtx;if(!h||!h.elegido)return;
  const e=h.elegido;
  if(e==='ANULADO'&&!String(h.motivo||'').trim()){
    const t=document.getElementById('hMot');t.classList.add('falta');t.focus();toast('Escribe el motivo de la anulación.',true);vibrar([30,40,30]);return;
  }
  const peds=h.todas?h.s.peds:[h.p];
  const cambian=peds.filter(p=>{const x=estadoDe(claveDe(h.prog.prog,p));
    return x.estado!==e||(e==='ANULADO'&&x.motivo!==h.motivo.trim())||(e==='ENTREGA PARCIAL'&&x.detalle!==h.detalle.trim());});
  if(!cambian.length){cerrarHoja();toast('Ya tenía ese estado.');return;}
  const prog=h.prog,u=h.u,mot=h.motivo,det=h.detalle;
  if(sinFotoPara(prog,cambian,e).length){
    hojaCtx={modo:'foto',prog,u,s:h.s,todas:false,pend:{peds:cambian,estado:e,motivo:'',detalle:e==='ENTREGA PARCIAL'?det.trim():''}};
    vibrar(10);pintarHoja();return;
  }
  cerrarHoja();vibrar(18);
  registrar(prog,u,cambian,e,e==='ANULADO'?mot.trim():'',e==='ENTREGA PARCIAL'?det.trim():'',true);
}
document.getElementById('velo').onclick=()=>cerrarHoja();
/* la hoja se cierra tocando la agarradera o la ✕, o deslizándola hacia abajo
   (desde arriba, o desde cualquier parte si su contenido ya está al inicio) */
(function(){
  const h=document.getElementById('hoja');
  let y0=null,dy=0,arrastra=false,t0=0;
  h.addEventListener('click',ev=>{if(ev.target.closest('[data-cerrar]'))cerrarHoja();});
  h.addEventListener('touchstart',ev=>{
    if(!hojaCtx||ev.touches.length!==1){y0=null;return;}
    const enTop=!!ev.target.closest('.hoja-top');
    if(h.scrollTop>2&&!enTop){y0=null;return;}
    if(!enTop&&ev.target.closest('textarea,input,select')){y0=null;return;}
    y0=ev.touches[0].clientY;dy=0;arrastra=false;t0=Date.now();
  },{passive:true});
  h.addEventListener('touchmove',ev=>{
    if(y0==null)return;
    dy=ev.touches[0].clientY-y0;
    if(!arrastra&&dy<-6){y0=null;return;}          // hacia arriba: es scroll normal
    if(dy>6){arrastra=true;h.style.transition='none';h.style.transform='translateY('+Math.max(0,dy-6)+'px)';
      document.getElementById('velo').style.opacity=String(Math.max(.2,1-dy/500));ev.preventDefault();}
  },{passive:false});
  const soltar=()=>{
    if(y0==null)return;
    const v=dy/Math.max(1,Date.now()-t0);
    h.style.transition='';document.getElementById('velo').style.opacity='';
    if(arrastra&&(dy>110||v>.55)){h.style.transform='translateY(105%)';vibrar(8);cerrarHoja();setTimeout(()=>{h.style.transform='';},320);}
    else h.style.transform='';
    y0=null;arrastra=false;
  };
  h.addEventListener('touchend',soltar);h.addEventListener('touchcancel',soltar);
})();
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(dlgAbierto)cerrarDialogo(false);else if(visorCtx)cerrarVisor();else if(hojaCtx)cerrarHoja();}});

/* ---------- diálogo propio (en lugar de las ventanas del navegador) ---------- */
let dlgAbierto=null;
function dialogo(tit,txt,si,no){
  return new Promise(res=>{
    dlgAbierto={res};
    history.pushState({dlg:1},'');
    document.getElementById('dlg').innerHTML=`<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlgT"><div class="dlg-caja"><h3 id="dlgT">${esc(tit)}</h3><p>${esc(txt)}</p>
      <div class="dlg-acc"><button id="dlgNo">${esc(no||'Cancelar')}</button><button class="si" id="dlgSi">${esc(si||'Aceptar')}</button></div></div></div>`;
    document.getElementById('dlgSi').onclick=()=>cerrarDialogo(true);
    document.getElementById('dlgNo').onclick=()=>cerrarDialogo(false);
    document.querySelector('#dlg .dlg').onclick=ev=>{if(ev.target.classList.contains('dlg'))cerrarDialogo(false);};
    setTimeout(()=>{const b=document.getElementById('dlgSi');if(b)b.focus();},50);
  });
}
function cerrarDialogo(v,desdePop){
  if(!dlgAbierto)return;
  const r=dlgAbierto.res;dlgAbierto=null;
  document.getElementById('dlg').innerHTML='';
  if(!desdePop){saltarPop++;history.back();}
  setTimeout(()=>r(v),desdePop?0:30);
}

/* ---------- aviso flotante con "Deshacer" ---------- */
let tToast=null;
function toast(txt,err,deshacer){
  const t=document.getElementById('toast'),b=document.getElementById('toastBtn');
  document.getElementById('toastTxt').textContent=txt;
  t.classList.toggle('err',!!err);t.classList.remove('oculto');
  if(deshacer){b.classList.remove('oculto');b.onclick=()=>{t.classList.add('oculto');deshacer();};}
  else{b.classList.add('oculto');b.onclick=null;}
  clearTimeout(tToast);tToast=setTimeout(()=>t.classList.add('oculto'),deshacer?6000:err?5000:2500);
}

/* ---------- se mantiene al día solo ---------- */
/* con la app abierta, la ruta se vuelve a consultar cada 30 segundos (antes 90) */
setInterval(()=>{if(ses&&!document.hidden&&!hojaCtx&&!dlgAbierto&&!ordenando&&!enviando&&Date.now()-ultimaCarga>30000)cargar(null,true);},10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ses){enviar();subirFotos();if(Date.now()-ultimaCarga>15000&&!ordenando)cargar(null,true);}});
window.addEventListener('online',()=>{enviar();subirFotos();if(ses)cargar(null,true);});
window.addEventListener('offline',()=>{errEnv='sin conexión';pintarSync();});

/* ---------- actualización automática del archivo ---------- */
async function revisarVersion(){
  if(location.protocol==='file:')return;
  try{
    const base=location.origin+location.pathname;
    const r=await fetch(base+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=(await r.text()).match(/const APP_VERSION\s*=\s*'([^']+)'/);
    if(!m||m[1]===APP_VERSION)return;
    const k='prove_upd_'+(location.pathname.split('/').pop()||'ruta');
    if(sessionStorage.getItem(k)===m[1])return;
    sessionStorage.setItem(k,m[1]);
    if(cola.length)guardar(K.cola,cola);
    location.replace(base+'?v='+encodeURIComponent(m[1]));
  }catch(e){}
}

/* ---------- app instalable ----------
   Mi Ruta vive en su propio repositorio (provesupervisor.github.io/MiRuta/)
   como index.html, con ruta.webmanifest y ruta-sw.js en la misma carpeta.
   La página siempre se pide a la red primero (las versiones nuevas llegan
   solas) y la copia guardada solo se usa si no hay señal. */
let pedidoInstalar=null;
function instalada(){
  return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
}
function esIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)&&!/crios|fxios/i.test(navigator.userAgent);}
function tarjetaInstalar(mostrar){
  const t=document.getElementById('inst');if(!t)return;
  const pospuesto=+leer('ruta_inst_no',0);
  if(!mostrar||instalada()||Date.now()-pospuesto<3*864e5){t.classList.add('oculto');document.body.classList.remove('con-inst');return;}
  t.innerHTML=`${simbolo('')}<div><b>Instala Mi Ruta</b><small>${esIOS()?'Toca Compartir y luego «Agregar a inicio».':'Ábrela desde la pantalla de inicio, sin buscar el enlace.'}</small></div>
    ${esIOS()?'':'<button class="inst-si" id="instSi">Instalar</button>'}<button class="inst-no" id="instNo" aria-label="Ahora no">×</button>`;
  t.classList.remove('oculto');document.body.classList.add('con-inst');
  const si=document.getElementById('instSi');if(si)si.onclick=instalarApp;
  document.getElementById('instNo').onclick=()=>{guardar('ruta_inst_no',Date.now());tarjetaInstalar(false);};
}
async function instalarApp(){
  if(instalada()){toast('Mi Ruta ya está instalada en este celular.');return;}
  if(!pedidoInstalar){
    toast(esIOS()?'En Safari toca Compartir y luego «Agregar a inicio».':'Abre el menú ⋮ del navegador y elige «Instalar aplicación» o «Agregar a pantalla de inicio».');
    return;
  }
  const p=pedidoInstalar;pedidoInstalar=null;
  p.prompt();
  let r=null;try{r=await p.userChoice;}catch(e){}
  tarjetaInstalar(false);
  if(r&&r.outcome==='accepted')toast('Listo. Mi Ruta queda en tu pantalla de inicio.');
}
window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();pedidoInstalar=ev;tarjetaInstalar(true);});
window.addEventListener('appinstalled',()=>{pedidoInstalar=null;tarjetaInstalar(false);});
if(esIOS()&&!instalada())setTimeout(()=>tarjetaInstalar(true),1500);
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',()=>{
    /* la primera versión se registraba solo para ruta.html: se retira */
    navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(x=>{if(/\/ruta\.html$/.test(x.scope))x.unregister();})).catch(()=>{});
    navigator.serviceWorker.register('ruta-sw.js',{scope:'./'}).catch(()=>{});
  });
}

revisarVersion();setInterval(revisarVersion,1800000);
