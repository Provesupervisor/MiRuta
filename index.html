  --negro:#1a1a1a;--negro2:#2a2c30;--negro3:#3a3d42;--vino:#7a0011;
  --rojo:#e1001a;--rojo2:#c0001a;--rojo-claro:#fde8ea;
  --fondo:#eef0f3;--tarjeta:#fff;--linea:#dde1e6;--linea2:#eceef1;
  --tinta:#17191c;--suave:#56616d;--suave2:#6b7785;
  --ruta:#5b6573;--ruta-bg:#eef0f3;--ruta-f:#8a939d;
  --proc:#9a4a07;--proc-bg:#fff4dc;--proc-f:#f59e0b;
  --term:#15803d;--term-bg:#e6f6eb;--term-f:#16a34a;
  --parc:#6d28d9;--parc-bg:#f2ecfe;--parc-f:#8b5cf6;
  --anul:#b91c1c;--anul-bg:#fdeeee;--anul-f:#dc2626;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --txt:"Barlow",Roboto,"Segoe UI",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --bar:56px;--tab:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.4 var(--txt);-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
.oculto{display:none!important}
.app{max-width:640px;margin:0 auto;min-height:100vh;position:relative;overflow-x:clip}
html{touch-action:pan-x pan-y;scroll-padding-top:76px;scroll-padding-bottom:100px}
body{touch-action:pan-x pan-y}
.c-EN_RUTA{--c:var(--ruta);--cbg:var(--ruta-bg);--cf:var(--ruta-f)}
.c-EN_PROCESO{--c:var(--proc);--cbg:var(--proc-bg);--cf:var(--proc-f)}
.c-TERMINADO{--c:var(--term);--cbg:var(--term-bg);--cf:var(--term-f)}
.c-ENTREGA_PARCIAL{--c:var(--parc);--cbg:var(--parc-bg);--cf:var(--parc-f)}
.c-ANULADO{--c:var(--anul);--cbg:var(--anul-bg);--cf:var(--anul-f)}
.est{display:inline-flex;align-items:center;gap:6px;flex:none;font-size:12.5px;font-weight:700;border-radius:99px;padding:4px 10px 4px 8px;white-space:nowrap;background:var(--cbg);color:var(--c);line-height:1.2}
.est::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cf)}
.ico{width:22px;height:22px;display:block;flex:none}

/* ---------- barra superior ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--negro);color:#fff;padding-top:var(--safe-t)}
.bar-in{height:var(--bar);display:flex;align-items:center;gap:6px;padding:0 6px 0 4px}
.bar .logo{width:34px;height:34px;margin:0 6px 0 10px;flex:none}
.bar .logo svg{width:34px;height:34px;display:block}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:none;color:#fff;display:grid;place-items:center;flex:none}
.ib:active{background:rgba(255,255,255,.12)}
.bar-tit{flex:1;min-width:0;line-height:1.15}
.bar-tit b{display:block;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-tit small{display:block;font-size:12.5px;color:#aeb5bd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#d4d8dd;background:var(--negro2);border:0;border-radius:99px;padding:6px 11px;min-height:34px;white-space:nowrap;flex:none}
.sync i{width:8px;height:8px;border-radius:50%;background:#22c55e;flex:none}
.sync.pend i{background:#f59e0b}.sync.err i{background:#ef4444}
.sync.envia i{background:#60a5fa;animation:lat 1s infinite}
@keyframes lat{50%{opacity:.3}}

/* ---------- pestañas inferiores ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--linea);padding-bottom:var(--safe-b)}
.tabbar-in{max-width:640px;margin:0 auto;height:var(--tab);display:grid;grid-template-columns:repeat(3,1fr)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--suave2);position:relative}
.tabbar button .pil{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .15s}
.tabbar button.on{color:var(--tinta)}
.tabbar button.on .pil{background:var(--rojo-claro);color:var(--rojo2)}
.tabbar .badge{position:absolute;top:6px;left:calc(50% + 10px);min-width:18px;height:18px;border-radius:9px;background:var(--rojo);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
body.con-tab .pant{padding-bottom:calc(var(--tab) + var(--safe-b) + 20px)}
body.con-pie .pant{padding-bottom:calc(92px + var(--safe-b))}

/* ---------- transición entre pantallas ---------- */
.pant{min-height:calc(100vh - var(--bar))}
.pant.adelante{animation:entraDer .24s cubic-bezier(.2,.8,.2,1)}
.pant.atras{animation:entraIzq .24s cubic-bezier(.2,.8,.2,1)}
.pant.fundido{animation:fundido .18s ease-out}
@keyframes entraDer{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}
@keyframes entraIzq{from{transform:translateX(-28px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fundido{from{opacity:.4}to{opacity:1}}

/* ---------- ruta: cabecera oscura del camión ---------- */
.hero{background:linear-gradient(160deg,#1a1a1a 0%,#2a2c30 70%,#4a0a14 100%);color:#fff;padding:6px 16px 18px;border-bottom:3px solid var(--rojo)}
.hero-f1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.placa{font:700 26px/1 var(--cond);letter-spacing:1.6px;background:#fff;color:var(--tinta);border-radius:7px;padding:6px 11px 4px;position:relative;white-space:nowrap}
.placa::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:7px 7px 0 0;background:var(--rojo)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:99px;padding:4px 11px;background:rgba(255,255,255,.12);color:#fff}
.chip.dia{background:#f5b800;color:var(--negro)}
.hero-sub{color:#b9c0c8;font-size:14px;margin-top:8px}
.turnos{display:flex;gap:4px;margin-top:12px;background:rgba(255,255,255,.08);border-radius:12px;padding:4px}
.turnos button{flex:1;border:0;background:none;color:#cfd4da;border-radius:9px;padding:9px 8px;font-size:14.5px;font-weight:600}
.turnos button.on{background:#fff;color:var(--negro)}
.hero-av{display:flex;align-items:center;gap:14px;margin-top:16px}
.anillo{--p:0;width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(#22c55e calc(var(--p)*1%),rgba(255,255,255,.14) 0)}
.anillo b{width:50px;height:50px;border-radius:50%;background:#24262a;display:grid;place-items:center;font:700 17px/1 var(--cond)}
.hero-av .tx b{display:block;font:700 26px/1 var(--cond)}
.hero-av .tx span{display:block;font-size:13.5px;color:#b9c0c8;margin-top:3px}
.tira{display:flex;gap:3px;height:8px;margin-top:14px}
.tira span{flex:1;border-radius:3px;background:rgba(255,255,255,.16)}
.tira span.c-EN_PROCESO{background:var(--proc-f)}.tira span.c-TERMINADO{background:#22c55e}
.tira span.c-ENTREGA_PARCIAL{background:#a78bfa}.tira span.c-ANULADO{background:#ef4444}
.tira span.actual{box-shadow:0 0 0 2px #fff}

/* ---------- tarjeta "ahora / siguiente" ---------- */
.foco{margin:-2px 12px 0;position:relative;top:-14px;background:#fff;border-radius:18px;box-shadow:0 10px 28px rgba(20,22,25,.14);padding:14px 14px 14px;border-top:4px solid var(--cf)}
.foco-et{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--c);text-transform:none}
.foco-et .pulso{width:9px;height:9px;border-radius:50%;background:var(--cf);box-shadow:0 0 0 0 var(--cf);animation:pulso 1.6s infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(245,158,11,.55)}100%{box-shadow:0 0 0 10px rgba(245,158,11,0)}}
.foco-cli{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:6px 0 0}
.foco-cli .tx{flex:1;min-width:0}
.fac-n,.cli,.meta{min-width:0}
.foco-cli b{display:block;font-size:21px;line-height:1.2;font-weight:700;overflow-wrap:anywhere}
.foco-cli small{display:block;font-size:14px;color:var(--suave);margin-top:3px}
.chev{color:#a3abb4;flex:none}
.nota{margin-top:10px;font-size:14px;background:#fff8d6;border-left:4px solid #e0b000;border-radius:8px;padding:8px 10px}
.acc{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;font-weight:700;font-size:16px;text-decoration:none;border:1.5px solid var(--linea);background:#fff;color:var(--tinta);padding:8px 12px}
.btn:active{transform:scale(.98)}
.btn .ico{width:20px;height:20px}
.btn.pri{background:var(--rojo);border-color:var(--rojo);color:#fff}
.btn.llegue{background:var(--proc-f);border-color:var(--proc-f);color:#1a1205}
.btn.entregado{background:var(--term-f);border-color:var(--term-f);color:#fff}
.btn.osc{background:var(--negro);border-color:var(--negro);color:#fff}
.btn.sec{flex:0 0 auto}
.btn.mini{min-height:44px;font-size:15px;border-radius:12px}

/* ---------- avisos de orden ---------- */
.orden-cta{margin:0 12px 12px;display:flex;align-items:center;gap:12px;width:calc(100% - 24px);text-align:left;border:2px dashed var(--negro);background:#fff;border-radius:16px;padding:12px 14px}
.orden-cta .ic{width:40px;height:40px;border-radius:12px;background:var(--negro);color:#fff;display:grid;place-items:center;flex:none;font:700 15px/1 var(--cond)}
.orden-cta b{display:block;font-size:16px}
.orden-cta small{color:var(--suave);font-size:13px;line-height:1.3;display:block}
.orden-ok{margin:0 12px 12px;display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:10px 14px;font-size:14px;color:var(--suave)}
.orden-ok svg{color:var(--term-f)}
.orden-ok b{color:var(--tinta)}

/* ---------- lista de paradas ---------- */
.seg{display:flex;gap:4px;margin:0 12px;background:#e1e5ea;border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-size:14px;font-weight:600;color:var(--suave)}
.seg button.on{background:#fff;color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button span{font:700 15px/1 var(--cond);margin-left:3px}
.lista{margin:12px 12px 0;background:#fff;border-radius:16px;overflow:hidden}
.fila{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;border:0;background:#fff;text-align:left;padding:12px 14px;position:relative;min-height:68px}
.fila+.fila{border-top:1px solid var(--linea2)}
.fila:active{background:#f6f7f9}
.nn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 19px/1 var(--cond);background:var(--cbg);color:var(--c);box-shadow:inset 0 0 0 2px var(--cf)}
.c-TERMINADO .nn,.c-ENTREGA_PARCIAL .nn,.c-ANULADO .nn,.c-EN_PROCESO .nn{background:var(--cf);color:#fff;box-shadow:none}
.nn.sin-orden{background:#fff;color:#8a939d;box-shadow:inset 0 0 0 2px #c7cdd4;border:0;outline:2px dashed #c7cdd4;outline-offset:-2px;box-shadow:none}
.fila .tx b{display:block;font-size:16.5px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .tx small{display:block;font-size:13.5px;color:var(--suave);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .der{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.fila .der small{font-size:12.5px;color:var(--suave);font-variant-numeric:tabular-nums}
.fila.siguiente::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--negro)}
.pend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b;margin-left:6px;vertical-align:2px}
.vacio{text-align:center;color:var(--suave);padding:42px 24px}
.vacio .ic{width:64px;height:64px;border-radius:20px;background:#fff;display:grid;place-items:center;margin:0 auto 14px;color:var(--suave2)}
.vacio b{display:block;color:var(--tinta);font-size:19px;margin-bottom:6px}
.vacio .btn{margin:16px auto 0;max-width:260px}

/* ---------- detalle de la parada ---------- */
.dh{background:#fff;padding:16px 16px 18px;border-bottom:1px solid var(--linea)}
.dh .est{font-size:13.5px;padding:5px 12px 5px 10px}
.dh h1{margin:10px 0 4px;font-size:25px;line-height:1.15;overflow-wrap:anywhere}
.dh p{margin:0;color:var(--suave);font-size:15px}
.dh .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ch{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;background:var(--fondo);color:var(--tinta);border-radius:8px;padding:5px 9px}
.ch.PROVINCIA{background:#fff1e0;color:#9a4a07}.ch.RETIRO{background:#efe8fd;color:#5b21b6}.ch.LOCAL{background:#e8eef6;color:#1f4f7a}
.bloque{margin:12px 12px 0;background:#fff;border-radius:16px;padding:6px 0}
.bloque h2{margin:0;padding:10px 16px 6px;font-size:13px;font-weight:700;color:var(--suave);letter-spacing:.2px}
.fac{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:12px 16px;min-height:60px}
.fac+.fac{border-top:1px solid var(--linea2)}
.fac:active{background:#f6f7f9}
.fac .ic-f{width:38px;height:38px;border-radius:11px;background:var(--cbg);color:var(--c);display:grid;place-items:center;flex:none}
.fac .tx{flex:1;min-width:0}
.fac .tx b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.fac .tx small{display:block;font-size:13px;color:var(--suave);overflow-wrap:anywhere}
.fac .tx small.mot{color:var(--anul)}.fac .tx small.det{color:var(--parc)}
.horas{display:grid;grid-template-columns:repeat(3,1fr);padding:4px 8px 8px}
.horas div{padding:6px 8px;text-align:center}
.horas small{display:block;font-size:12px;color:var(--suave)}
.horas b{display:block;font:700 22px/1.1 var(--cond);margin-top:2px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 12px 0}
.pager button{display:flex;align-items:center;gap:8px;border:0;background:#fff;border-radius:14px;padding:12px;min-height:58px;text-align:left;min-width:0}
.pager button:last-child{justify-content:flex-end;text-align:right}
.pager button:disabled{opacity:.4}
.pager .tx{min-width:0}
.pager small{display:block;font-size:12px;color:var(--suave)}
.pager b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pie{position:fixed;left:0;right:0;bottom:0;z-index:19;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--linea);padding:10px 12px calc(10px + var(--safe-b))}
.pie-in{max-width:616px;margin:0 auto;display:flex;gap:8px}
.desliza{font-size:12.5px;color:var(--suave2);text-align:center;margin:12px 0 0}

/* ---------- resumen ---------- */
.res-hero{background:linear-gradient(160deg,#1a1a1a 0%,#2a2c30 70%,#4a0a14 100%);color:#fff;padding:18px 16px 22px;border-bottom:3px solid var(--rojo);display:flex;align-items:center;gap:16px}
.res-hero .anillo{width:92px;height:92px}
.res-hero .anillo b{width:76px;height:76px;font-size:25px}
.res-hero .tx b{display:block;font:700 30px/1 var(--cond)}
.res-hero .tx span{display:block;color:#b9c0c8;font-size:14px;margin-top:4px}
.barras{padding:6px 16px 12px}
.barras .f{display:grid;grid-template-columns:118px 1fr 34px;align-items:center;gap:10px;padding:7px 0;font-size:14.5px}
.barras .f i{display:block;height:10px;border-radius:5px;background:var(--linea2);overflow:hidden}
.barras .f i span{display:block;height:100%;background:var(--cf);border-radius:5px}
.barras .f b{font:700 18px/1 var(--cond);text-align:right}
.metricas{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--linea2)}
.metricas div{background:#fff;padding:12px 16px}
.metricas small{display:block;font-size:12.5px;color:var(--suave)}
.metricas b{display:block;font:700 24px/1.1 var(--cond);margin-top:2px}

/* ---------- más (ajustes) ---------- */
.perfil{display:flex;align-items:center;gap:14px;background:#fff;margin:12px;border-radius:16px;padding:14px 16px}
.perfil .av{width:48px;height:48px;border-radius:50%;background:var(--negro);color:#fff;display:grid;place-items:center;font:700 19px/1 var(--cond);flex:none}
.perfil b{display:block;font-size:17px}
.perfil small{color:var(--suave);font-size:13.5px}
.opcion{display:flex;align-items:center;gap:14px;width:100%;border:0;background:#fff;text-align:left;padding:13px 16px;min-height:60px;position:relative}
.opcion+.opcion{border-top:1px solid var(--linea2)}
.opcion:active{background:#f6f7f9}
.opcion .oi{width:38px;height:38px;border-radius:11px;background:var(--fondo);display:grid;place-items:center;flex:none;color:var(--tinta)}
.opcion .tx{flex:1;min-width:0}
.opcion .tx b{display:block;font-size:16px;font-weight:600}
.opcion .tx small{display:block;font-size:13px;color:var(--suave)}
.opcion.peligro .tx b{color:var(--anul)}.opcion.peligro .oi{background:var(--anul-bg);color:var(--anul)}
.opcion input[type=date]{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.ver{font-size:12.5px;color:var(--suave2);text-align:center;margin:16px 0 0}

/* ---------- camiones ---------- */
.titulo-p{padding:18px 16px 4px}
.titulo-p h1{margin:0;font-size:24px}
.titulo-p p{margin:4px 0 0;color:var(--suave);font-size:14.5px}
.unid{display:block;width:calc(100% - 24px);margin:10px 12px 0;text-align:left;background:#fff;border:0;border-radius:18px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.unid:active{transform:scale(.99)}
.unid .f1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.unid .placa{font-size:21px;padding:5px 9px 3px;border:2px solid var(--tinta)}
.unid .chip{background:var(--fondo);color:var(--tinta)}
.unid .chip.t2{background:#e3eefb;color:#0f4c81}
.unid .ds{color:var(--suave);font-size:14px;margin-top:8px}
.unid .tira{margin-top:10px;height:7px}
.unid .tira span{background:#dfe3e8}
.unid .cuenta{display:flex;justify-content:space-between;font-size:13px;color:var(--suave);margin-top:6px}
.unid .cuenta b{color:var(--tinta)}

/* ---------- ordenar ---------- */
.ord-ayuda{margin:12px;background:#fff;border-radius:16px;padding:14px 16px;font-size:15px;color:var(--suave);border-left:5px solid var(--rojo)}
.ord-ayuda b{display:block;font-size:17px;color:var(--tinta);margin-bottom:3px}
.ord-lista{margin:0 12px;background:#fff;border-radius:16px;overflow:hidden}
.ord-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:0;padding:12px 14px;min-height:66px}
.ord-item+.ord-item{border-top:1px solid var(--linea2)}
.ord-item.on{background:#f7f8fa}
.ord-num{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 20px/1 var(--cond);border:2.5px dashed #b8bec6;color:#b8bec6}
.ord-item.on .ord-num{border:0;background:var(--negro);color:#fff}
.ord-item .tx{flex:1;min-width:0}
.ord-item .tx b{display:block;font-size:16px;overflow-wrap:anywhere}
.ord-item .tx small{color:var(--suave);font-size:13px}

/* ---------- hoja inferior (cambiar estado) ---------- */
.velo{position:fixed;inset:0;background:rgba(10,12,15,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.velo.on{opacity:1;pointer-events:auto}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:22px 22px 0 0;max-width:640px;margin:0 auto;padding:10px 16px calc(16px + var(--safe-b));max-height:92vh;overflow:auto;transform:translateY(0);transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.hoja.cerrada{transform:translateY(105%)}
.asa{display:block;width:44px;height:5px;border-radius:3px;background:#cfd4da;margin:0 auto}
/* cabecera fija de la hoja: agarradera (tocar o arrastrar) y ✕ */
.hoja-top{position:sticky;top:-10px;z-index:3;margin:-10px -16px 6px;height:44px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:22px 22px 0 0;touch-action:none}
.asa-btn{border:0;background:none;width:120px;height:44px;display:grid;place-items:center;padding:0;cursor:grab}
.asa-btn:active .asa{background:#9aa3ad}
.hoja-x{position:absolute;right:10px;top:6px;width:34px;height:34px;border-radius:50%;border:0;background:#f1f3f5;color:#3a4048;font-size:16px;font-weight:700;display:grid;place-items:center}
.hoja-x:active{background:#e2e6ea}
.hoja h3{margin:0;font-size:20px}
.hoja .sub{color:var(--suave);font-size:14px;margin:2px 0 14px}
.opciones{display:flex;flex-direction:column;gap:8px}
.opc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--linea);background:#fff;border-radius:14px;padding:11px 12px;min-height:60px}
.opc .oi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--cf);color:#fff}
.opc .oi svg{width:20px;height:20px}
.opc b{display:block;font-size:16px}
.opc small{color:var(--suave);font-size:13px}
.opc.actual{background:#f6f7f9}
.opc.actual::after{content:"actual";margin-left:auto;font-size:12px;font-weight:600;color:var(--suave)}
.opc.marcada{border-color:var(--negro)}
.campo{margin-top:14px}
.campo label{display:block;font-weight:700;margin-bottom:6px}
.campo label em{font-style:normal;font-weight:400;color:var(--suave)}
.campo textarea{width:100%;min-height:86px;border:2px solid var(--linea);border-radius:12px;padding:10px 12px;font:inherit;resize:vertical}
.campo textarea.falta{border-color:var(--anul);background:#fff7f7}
.rapidos{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.rapidos button{border:1px solid var(--linea);background:#f6f7f9;border-radius:99px;padding:8px 12px;font-size:14px}
.todas{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px;padding:12px;border-radius:12px;background:#f6f7f9}
.todas input{width:22px;height:22px;accent-color:var(--negro)}
.btn-guardar{width:100%;margin-top:14px;min-height:54px;border:0;border-radius:14px;background:var(--rojo);color:#fff;font-weight:700;font-size:17px}
.btn-sec{width:100%;margin-top:6px;min-height:48px;border:0;background:none;color:var(--suave);font-size:15px;font-weight:600}

/* ---------- diálogo ---------- */
.dlg{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgba(10,12,15,.5)}
.dlg-caja{background:#fff;border-radius:22px;max-width:380px;width:100%;padding:22px 20px 14px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:sube .2s ease-out}
@keyframes sube{from{transform:translateY(16px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.dlg-caja h3{margin:0 0 8px;font-size:19px}
.dlg-caja p{margin:0;color:var(--suave);font-size:15px;white-space:pre-line}
.dlg-acc{display:flex;justify-content:flex-end;gap:6px;margin-top:18px}
.dlg-acc button{border:0;background:none;font-weight:700;font-size:15px;padding:12px 14px;border-radius:10px;color:var(--suave)}
.dlg-acc button.si{color:var(--rojo2)}
.dlg-acc button:active{background:var(--fondo)}

/* ---------- ingreso ---------- */
.portada{min-height:100vh;display:flex;flex-direction:column;background:#fff}
.portada-cab{background:linear-gradient(160deg,#1a1a1a 0%,#2a2c30 65%,#5a0a16 100%);padding:calc(36px + var(--safe-t)) 24px 28px;color:#fff;border-bottom:4px solid var(--rojo)}
.portada-cab img{height:22px;display:block;margin-bottom:28px}
.portada-marca{display:flex;align-items:center;gap:16px}
.portada-marca svg{width:72px;height:72px;display:block;flex:none;filter:drop-shadow(0 8px 16px rgba(0,0,0,.35))}
.portada-cab h1{margin:0;font:700 38px/1 var(--cond);letter-spacing:.2px}
.portada-cab p{margin:6px 0 0;color:#b9c0c8}
.form{padding:22px 24px;max-width:460px;width:100%;margin:0 auto}
.form label{display:block;font-weight:700;margin:14px 0 6px}
.form input{width:100%;min-height:54px;border:2px solid var(--linea);border-radius:14px;padding:0 14px;font:inherit;font-size:17px;background:#fff}
.form input:focus{border-color:var(--negro);outline:none}
.form .btn-guardar{margin-top:22px}
.aviso{border-radius:12px;padding:11px 13px;font-size:14px;margin-top:14px;background:var(--anul-bg);color:#8a1414}
.aviso.info{background:#e8eef6;color:#1f4f7a}
.ayuda{font-size:14px;color:var(--suave);margin-top:18px}
.firma{margin:26px auto 10px;padding:0 24px;max-width:460px;width:100%;text-align:center;font-size:12.5px;line-height:1.45;color:var(--suave)}
.firma::before{content:"";display:block;width:34px;height:3px;border-radius:2px;background:var(--rojo);margin:0 auto 10px}
.firma b{color:var(--tinta);font-weight:700}
.portada .firma{margin-top:auto;padding-bottom:calc(18px + var(--safe-b))}
.esq{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,#e6e9ed,#f1f3f5,#e6e9ed);background-size:200% 100%;animation:brillo 1.2s infinite}
@keyframes brillo{to{background-position:-200% 0}}

/* ---------- avisos flotantes ---------- */
.toast{position:fixed;left:12px;right:12px;bottom:calc(16px + var(--safe-b));max-width:616px;margin:0 auto;z-index:50;background:#23262b;color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:15px;box-shadow:0 10px 26px rgba(0,0,0,.3)}
body.con-tab .toast{bottom:calc(var(--tab) + 12px + var(--safe-b))}
body.con-pie .toast{bottom:calc(86px + var(--safe-b))}
.toast.err{background:#8a1414}
.toast span{flex:1}
.toast button{border:0;background:none;color:#fbbf24;font-weight:700;font-size:15px;padding:6px}
.inst{position:fixed;left:12px;right:12px;bottom:calc(14px + var(--safe-b));max-width:616px;margin:0 auto;z-index:30;background:var(--negro);color:#fff;border-radius:18px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(0,0,0,.35);border-left:5px solid var(--rojo)}
body.con-tab .inst{bottom:calc(var(--tab) + 12px + var(--safe-b))}
.inst svg{width:44px;height:44px;flex:none;display:block}
.inst div{flex:1;min-width:0}
.inst b{display:block;font-size:15px}
.inst small{display:block;color:#b8bec6;font-size:13px;line-height:1.3;margin-top:2px}
.inst .inst-si{border:0;background:var(--rojo);color:#fff;font-weight:700;font-size:15px;border-radius:12px;padding:11px 14px;flex:none}
.inst .inst-no{border:0;background:none;color:#8b929b;font-size:22px;line-height:1;padding:4px 4px 4px 0;flex:none}
body.con-pie .inst,body:has(.hoja:not(.cerrada)) .inst{display:none}

/* ---------- lista de paradas como antes: línea de ruta con tarjetas ---------- */
.conteos{display:flex;flex-wrap:wrap;gap:6px 12px;padding:8px 16px 0;font-size:13px;color:var(--suave)}
.conteos span{display:inline-flex;align-items:center;gap:5px}
.conteos i{width:10px;height:10px;border-radius:3px;background:var(--cf)}
.tl{padding:6px 12px 0}
.parada{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:10px;position:relative}
.parada::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:2px;background:var(--linea)}
.parada:first-child::before{top:22px}
.parada:last-child::before{bottom:auto;height:22px}
.num{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 20px/1 var(--cond);background:#fff;border:2.5px solid var(--ruta);color:var(--ruta);margin-top:10px}
.parada.c-EN_PROCESO .num,.parada.c-TERMINADO .num,.parada.c-ENTREGA_PARCIAL .num,.parada.c-ANULADO .num{border-color:var(--cf);background:var(--cf);color:#fff}
.num.sin-orden{border-style:dashed;color:#9aa1aa;border-color:#b8bec6}
.tarjeta{background:#fff;border:1px solid var(--linea);border-radius:16px;margin:8px 0;padding:14px 14px 12px;min-width:0}
.parada.c-EN_PROCESO .tarjeta{border:2px solid var(--proc-f);box-shadow:0 6px 18px rgba(180,83,9,.16)}
.parada.siguiente .tarjeta{border:2px solid var(--negro);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.parada.siguiente.c-EN_PROCESO .tarjeta{border-color:var(--proc-f)}
.t-cab{display:flex;align-items:flex-start;gap:10px}
.t-cab-tx{flex:1;min-width:0}
.t-cab .nov-btn{margin-top:-2px}
@media (max-width:350px){.t-cab .nov-btn span{display:none}.t-cab .nov-btn{padding:0 9px}}
.etq-sig{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--negro);border-radius:6px;padding:2px 8px;margin-bottom:6px}
.parada.c-EN_PROCESO .etq-sig{background:var(--proc-f);color:#1a1205}
.cli{font-size:18px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.meta{font-size:14px;color:var(--suave);margin-top:3px}
.meta .ch{margin-left:6px;padding:1px 7px;font-size:12px;vertical-align:1px}
.prog-n{display:inline-block;font-size:12px;color:var(--suave);border:1px solid var(--linea);border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:1px}
.facs{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.facb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--linea);background:#fafbfc;border-radius:12px;padding:9px 10px;min-height:50px}
.facb:active{background:#f0f2f5}
.fac-n{flex:1;min-width:0;font-weight:600;font-variant-numeric:tabular-nums}
.fac-n small{display:block;font-weight:400;font-size:13px;overflow-wrap:anywhere}
.facb .flecha{color:#9aa1aa;font-size:18px}
.hrs{font-size:13px;color:var(--suave);margin-top:8px}
/* botones de la tarjeta: nunca más anchos que la tarjeta */
.tarjeta .acc{display:flex;gap:8px}
.tarjeta .acc .btn{min-height:50px;min-width:0;white-space:normal;line-height:1.15;text-align:center;padding:8px 10px}
.tarjeta .acc a.btn{flex:0 0 auto;padding:8px 14px;white-space:nowrap}
.tarjeta .acc button.btn{flex:1 1 0}
@media (max-width:390px){
  .tarjeta .acc a.btn .txt{display:none}
  .tarjeta .acc a.btn{padding:8px 13px}
  .tarjeta .acc .btn{font-size:15px}
}
@media (max-width:340px){.tl{padding:6px 8px 0}.parada{grid-template-columns:36px minmax(0,1fr);column-gap:8px}.num{width:36px;height:36px;font-size:17px}.parada::before{left:17px}.tarjeta{padding:12px 10px 10px}}
.compacta .tarjeta{padding:10px 12px}
/* novedades por parada */
/* pie de la tarjeta: horas a la izquierda, "Novedad" a la derecha (no le quita ancho al nombre) */
.t-pie{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;min-height:32px}
.t-pie .hrs{margin-top:0;min-width:0;flex:1}
.nov-btn{flex:none;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:99px;border:1.5px solid #e2cf9f;background:#fffaf0;color:#7a5200;font-size:13px;font-weight:700}
.nov-btn .ico{width:16px;height:16px}
.nov-btn i{font-style:normal;background:#b45309;color:#fff;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;font-size:11.5px;padding:0 5px}
.nov-btn:active{transform:scale(.96)}
.compacta .t-pie{margin-top:6px}.compacta .nov-btn{height:30px}
.t-pie+.acc{margin-top:8px}
.novs{display:grid;gap:6px;margin-top:10px}
.nov{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;background:#fff7e8;border:1px solid #f1d5a3;border-left:4px solid #d97706;border-radius:10px;padding:8px 10px;font:inherit;color:inherit}
.nov-ic{color:#b45309;flex:none;margin-top:1px;display:grid}.nov-ic svg{width:18px;height:18px}
.nov-tx{min-width:0;flex:1}.nov-tx b{display:block;font-size:14px;line-height:1.3}
.nov-tx small{display:block;font-size:13.5px;color:#3d3420;margin-top:2px;overflow-wrap:anywhere}
.nov-tx em{display:block;font-style:normal;font-size:12px;color:var(--suave);margin-top:3px}
.nov-link{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;text-align:left;border:1.5px dashed #d6c08a;background:#fffaf0;border-radius:14px;padding:11px 12px;color:#5c3d00;font:inherit}
.nov-link>.ico:first-child{width:22px;height:22px;color:#b45309;flex:none}
.nov-link b{display:block;font-size:15px}.nov-link small{color:#7a6a4a;font-size:12.5px}
.nov-link .chev{margin-left:auto}
.nov-op .oi{background:#d97706}
.nov-ayuda{margin:2px 0 10px;font-size:13.5px;color:var(--suave)}
.rapidos button.on{background:var(--negro);color:#fff;border-color:var(--negro)}
.nov-min{width:100%;height:46px;border:2px solid var(--linea);border-radius:12px;padding:0 12px;font:inherit;font-size:16px}
@media (max-width:330px){.nov-btn span{display:none}.nov-btn{padding:0 9px}}
.nov-min-c{display:inline-block;background:#fde7c4;color:#7a4300;font-weight:700;border-radius:5px;padding:0 6px;margin-right:6px}
.compacta .cli{font-size:16px}
.compacta .num{width:36px;height:36px;font-size:16px;margin:8px 4px 0}

/* ---------- camiones: avance de cada placa ---------- */
.avance-gral{display:flex;align-items:center;gap:14px;margin:12px 12px 2px;background:linear-gradient(160deg,#1a1a1a 0%,#2a2c30 70%,#4a0a14 100%);color:#fff;border-radius:18px;padding:14px 16px}
.avance-gral .tx b{display:block;font:700 22px/1.1 var(--cond)}
.avance-gral .tx span{display:block;font-size:13px;color:#b9c0c8;margin-top:2px}
.avance-gral .anillo{width:66px;height:66px}
.avance-gral .anillo b{width:54px;height:54px;background:#26282c}
.anillo b{text-align:center;letter-spacing:-.3px}
.anillo b.largo{font-size:15px}
/* selector de día en la lista de camiones */
.fecha-sel{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.fecha-sel .fl{width:40px;height:40px;border-radius:12px;border:0;background:#fff;color:var(--tinta);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.fecha-sel .fl:active,.fecha-ch:active{background:#f0f2f5}
.fecha-ch{position:relative;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:#fff;font-weight:600;font-size:15px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer}
.fecha-ch .ico{width:18px;height:18px;color:var(--rojo2)}
.fecha-ch .bajar{color:var(--suave2);font-size:12px}
.fecha-ch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.fecha-sel .hoy{height:40px;border:0;border-radius:12px;background:var(--rojo);color:#fff;font-weight:700;padding:0 14px}
.unid .pct{margin-left:auto;font:700 24px/1 var(--cond)}
.unid.actual{box-shadow:0 0 0 2px var(--negro)}
.unid .tira span.c-EN_PROCESO,.unid .tira span.c-TERMINADO,.unid .tira span.c-ENTREGA_PARCIAL,.unid .tira span.c-ANULADO{background:var(--cf)}
.unid .cuenta{flex-wrap:wrap;gap:4px 10px;align-items:center}
.unid .ln{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--c);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.unid .ln b{color:var(--tinta);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.unid .ln i{width:8px;height:8px;border-radius:50%;background:var(--cf);flex:none}
.unid .ln svg{width:16px;height:16px}

/* ---------- permisos: tu camión / solo lectura ---------- */
.unid .chip.tuyo{background:var(--term-f);color:#fff}
.unid .chip.lect{background:var(--fondo);color:var(--suave)}
.unid .chip.lect svg{width:13px;height:13px}
.unid.mio{box-shadow:0 0 0 2px var(--term-f)}
.unid.mio.actual{box-shadow:0 0 0 2px var(--negro)}
.aviso-p{display:flex;gap:10px;align-items:flex-start;margin:10px 12px 0;background:#fff;border-left:4px solid var(--suave2);border-radius:12px;padding:11px 13px;font-size:14px;color:var(--suave)}
.aviso-p svg{width:18px;height:18px;flex:none;margin-top:1px}
.aviso-p b{color:var(--tinta)}
.lectura{display:flex;align-items:center;gap:10px;margin:0 12px 12px;background:#fff;border:1.5px dashed var(--suave2);border-radius:14px;padding:11px 13px}
.lectura>svg{width:20px;height:20px;flex:none;color:var(--suave)}
.lectura div{flex:1;min-width:0}
.lectura b{display:block;font-size:15px}
.lectura span{display:block;font-size:13px;color:var(--suave);line-height:1.3}
.lectura .btn{flex:0 0 auto;padding:6px 12px;min-height:40px;font-size:14px}
.tl.ro .facb{cursor:default}
.tl.ro .facb:active{background:#fafbfc}

/* ---------- fotos de la guía firmada ---------- */
.fac-num{display:block;overflow-wrap:anywhere}
.fac-n .fb{display:inline-flex;width:max-content;max-width:100%;margin-top:4px}
.fb{display:inline-flex;align-items:center;gap:4px;flex:none;font-size:12px;font-weight:700;border-radius:99px;padding:3px 8px;line-height:1.2;white-space:nowrap}
.fb svg{width:14px;height:14px}
.fb.ok{background:#e7f0fb;color:#1e4f86}
.fb.falta{background:#fff1e0;color:#9a4a07;border:1px dashed #e0a35a}
.fb.pend{background:#fff4dc;color:#7a4b00}
.nov-btn.foto-btn{border-color:#b9cbe3;background:#f2f7fd;color:#1e4f86}
.nov-btn.foto-btn i{background:#1e4f86}
.nov-btn.foto-btn.falta{border-color:#e0a35a;background:#fff4e6;color:#9a4a07}
.nov-btn.foto-btn.falta i{background:#c2410c}
.t-acc-btns{display:flex;gap:6px;flex:none;margin-left:auto}
.t-pie{flex-wrap:wrap;row-gap:6px}.t-pie .hrs{flex:1 1 170px}
.btn.foto{background:#1e4f86;border-color:#1e4f86;color:#fff}
.foto-link{border-color:#b9cbe3;background:#f2f7fd;color:#173c66}
.foto-link>.ico:first-child{color:#1e4f86}
.foto-link small{color:#4b6280}
.ff{border:1px solid var(--linea);border-radius:14px;padding:10px 12px;margin-top:8px}
.ff-cab{display:flex;align-items:center;gap:8px;justify-content:space-between}
.ff-cab b{font-size:15.5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-width:0}
.ff-cab small{display:block;font-size:12.5px;color:var(--suave);font-weight:400}
.miniaturas{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mini{position:relative;width:72px;height:72px;border-radius:12px;border:0;padding:0;overflow:hidden;background:#e9edf2;display:grid;place-items:center;color:#1e4f86;flex:none}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.mini .ok-ic{display:grid;place-items:center;gap:2px;font-size:11px;font-weight:700}
.mini .ok-ic svg{width:24px;height:24px}
.mini .p{position:absolute;right:4px;top:4px;width:12px;height:12px;border-radius:50%;background:#f59e0b;border:2px solid #fff}
.mini .h{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;text-align:center;padding:1px 0}
.cam-acc{display:flex;gap:8px;margin-top:10px}
.cam-acc .btn{min-height:46px;font-size:15px;border-radius:12px}
.cam-acc .btn.cam{background:#1e4f86;border-color:#1e4f86;color:#fff;flex:1}
.cam-acc .btn.gal{flex:0 0 auto;padding:8px 14px}
.ff-todas{display:flex;align-items:center;gap:10px;font-size:15px;padding:12px;border-radius:12px;background:#f2f7fd;margin-bottom:4px}
.ff-todas input{width:22px;height:22px;accent-color:#1e4f86;flex:none}
.foto-guia{font-size:13px;color:var(--suave);margin:0 0 6px}
.ff-error{background:#fff1f2;border-left:4px solid #dc2626;border-radius:12px;padding:10px 12px;margin:10px 0 4px;font-size:13.5px;line-height:1.35;color:#7f1d1d}
.ff-error b{display:block;font-size:14.5px;margin-bottom:2px}
.ff-aviso{display:flex;gap:10px;align-items:flex-start;background:#eef4fc;border-left:4px solid #1e4f86;border-radius:12px;padding:11px 12px;margin:0 0 10px;font-size:14.5px;color:#173c66;line-height:1.35}
.ff-aviso svg{width:20px;height:20px;flex:none;color:#1e4f86;margin-top:1px}
.ff.req{border:2px solid #1e4f86;background:#fbfdff}
.ff.req .ff-cab small{color:#1e4f86;font-weight:700}
.procesando{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:#1e4f86;font-weight:600}
.procesando i{width:16px;height:16px;border-radius:50%;border:3px solid #b9cbe3;border-top-color:#1e4f86;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.visor{position:fixed;inset:0;z-index:55;background:#0b0c0e;display:flex;flex-direction:column;color:#fff}
.visor-bar{display:flex;align-items:center;gap:8px;padding:calc(6px + var(--safe-t)) 8px 6px}
.visor-bar .tx{flex:1;min-width:0;line-height:1.2}
.visor-bar .tx b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.visor-bar .tx small{display:block;font-size:12.5px;color:#aeb5bd}
.visor-bar .quitar{border:0;background:#3a1418;color:#fca5a5;font-weight:700;border-radius:10px;padding:10px 12px;font-size:14px}
.visor-bar .cambiar{display:inline-flex;align-items:center;gap:6px;border:0;background:#1e4f86;color:#fff;font-weight:700;border-radius:10px;padding:10px 12px;font-size:14px;white-space:nowrap}
.visor-bar .cambiar svg{width:18px;height:18px}
.visor-nota{margin:0 12px 8px;padding:9px 12px;border-radius:10px;background:#16243a;color:#c9dbf2;font-size:13px;line-height:1.35}
.visor-cuerpo{flex:1;display:grid;place-items:center;overflow:auto;padding:8px 8px calc(12px + var(--safe-b))}
.visor-cuerpo img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;touch-action:pinch-zoom}
.visor-cuerpo .msg{color:#cfd4da;text-align:center;font-size:15px;padding:24px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){.app{box-shadow:0 0 0 1px var(--linea)}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="velo" id="velo"></div>
<div class="hoja cerrada" id="hoja" role="dialog" aria-modal="true" aria-labelledby="hojaTit"></div>
<div id="dlg"></div>
<div class="inst oculto" id="inst" role="region" aria-label="Instalar Mi Ruta"></div>
<div class="visor oculto" id="visor" role="dialog" aria-modal="true" aria-label="Foto de la guía"></div>
<input type="file" id="camara" accept="image/*" capture="environment" class="oculto" aria-hidden="true" tabindex="-1">
<input type="file" id="galeria" accept="image/*" class="oculto" aria-hidden="true" tabindex="-1">
<div class="toast oculto" id="toast" role="status"><span id="toastTxt"></span><button id="toastBtn" class="oculto">Deshacer</button></div>

let usuarioEscrito='', ultimoError='', filtro='pend', enviando=false, ultimaCarga=0, ultimaPos=null, menuAbierto=false;
let fotoCola=[], subiendo=false;    // fotos por subir (el archivo vive en IndexedDB)
if(datos)indexarServidor(datos.estados||[]);
function pendientes(){return cola.length+fotoCola.length;}

/* ---------- utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function hoyLima(){return new Date(Date.now()-5*3600e3).toISOString().slice(0,10);}
function horaLima(ms){return new Date(ms).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Lima'});}
function hhmm(txt){return txt?String(txt).slice(11,16):'';}
function minutos(a,b){const x=Date.parse(String(a).replace(' ','T')),y=Date.parse(String(b).replace(' ','T'));return isNaN(x)||isNaN(y)?null:Math.round((y-x)/60000);}
function fechaLarga(iso){const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('es-PE',{weekday:'short',day:'numeric',month:'short'});}
function normPlaca(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function normCli(s){return String(s||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z0-9]/g,'');}
function claveParada(p){const c=normCli(p.CLIENTES);return c?c+'|'+normCli(p.DISTRITO):'ID'+p.id;}
function titulo(s){return String(s||'').toLowerCase().replace(/(^|[\s\/.(-])([a-záéíóúñ])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(Sac|Eirl|Srl|Sa|Saa)\b/g,m=>m.toUpperCase());}
function facKey(p){return String(p.FACTURA||'').trim().toUpperCase()||('ID'+p.id);}
function claveDe(prog,p){return prog+'|'+facKey(p);}
function nuevoId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ---------- red ---------- */
async function pedir(cuerpo,ms){
  const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||25000);
  try{
    const r=await fetch(nubeUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(Object.assign({usuario:ses&&ses.usuario,clave:ses&&ses.clave},cuerpo)),signal:c.signal});
    if(!r.ok)throw new Error('el servidor respondió '+r.status);
    let j;try{j=await r.json();}catch(e){throw new Error('respuesta no válida del servidor');}
    /* v12: el servidor entrega un pase de sesión; el celular guarda el pase, nunca la contraseña */
    if(j&&j.ok&&j.token&&ses){ses.clave=j.token;guardar(K.ses,ses);}
    return j;
  }catch(e){throw new Error(e.name==='AbortError'?'el servidor no respondió a tiempo':(/fetch|network|Failed/i.test(e.message)?'sin conexión':e.message));}
  finally{clearTimeout(t);}
}
function esAuth(msg){return /no autorizad/i.test(String(msg||''));}

/* ---------- estado de cada factura ---------- */
function indexarServidor(lista){srv={};(lista||[]).forEach(mezclarServidor);}
function mezclarServidor(e){
  const k=e.clave;if(!k)return;
  const p=srv[k];
  const tn=Math.max(+e.tsCliente||0,+e.tsOrden||0),tp=p?Math.max(+p.tsCliente||0,+p.tsOrden||0):-1;
  if(!p||tn>=tp)srv[k]=e;
}
/* lo pendiente en el celular manda sobre lo del servidor hasta que se envíe */
function estadoDe(clave){
  let ult=null;for(const c of cola)if(c.clave===clave&&!c.soloOrden&&!c.incidencia&&!c.borrarInc&&(!ult||c.ts>=ult.ts))ult=c;
  const s=srv[clave];
  if(ult&&(!s||ult.ts>=(+s.tsCliente||0))){
    let lleg='';
    if(ult.estado!=='EN RUTA'){
      if(s&&s.horaLlegada&&s.estado!=='EN RUTA')lleg=s.horaLlegada;
      else{const pr=cola.filter(c=>c.clave===clave&&c.estado==='EN PROCESO').sort((x,y)=>x.ts-y.ts)[0];if(pr)lleg='~'+horaLima(pr.ts);}
    }
    return {estado:ult.estado,motivo:ult.motivo||'',detalle:ult.detalle||'',pend:true,horaLlegada:lleg,horaFin:FINAL[ult.estado]?'~'+horaLima(ult.ts):''};
  }
  if(s)return {estado:s.estado||'EN RUTA',motivo:s.motivo,detalle:s.detalle,horaLlegada:s.horaLlegada,horaFin:s.horaFin,pend:false};
  return {estado:'EN RUTA',pend:false};
}
/* orden de visita que puso el chofer (0 = todavía no lo puso) */
function ordenDe(clave){
  let ult=null;for(const c of cola)if(c.clave===clave&&c.orden!==undefined&&(!ult||c.ts>=ult.ts))ult=c;
  const s=srv[clave];
  if(ult&&(!s||ult.ts>=(+s.tsOrden||0)))return +ult.orden||0;
  return s?(+s.ordenVisita||0):0;
}
/* ¿el orden de esta factura ya fue confirmado? (lo pendiente en el celular cuenta) */
function confirmadoDe(clave){
  if(cola.some(c=>c.clave===clave&&c.confirmar))return true;
  const s=srv[clave];return !!(s&&(s.ordenConfirmado===true||s.ordenConfirmado==='SI'));
}
function horaCorta(h){if(!h)return '';return String(h).startsWith('~')?h.slice(1):hhmm(h);}

/* ---------- quién puede editar qué ----------
   El servidor dice el permiso de este usuario (datos.yo.permiso):
   'todo' (admin/editor) · 'asignado' (chofer o auxiliar: solo su camión) · 'ver' (consulta).
   Con un Apps Script anterior a la v11 no llega: se comporta como antes. */
function permiso(){return (datos&&datos.yo&&datos.yo.permiso)||'todo';}
function esMio(u){
  if(!u||!ses)return false;
  const yo=String(ses.usuario||'').trim().toLowerCase();
  return (u.equipo||[]).some(e=>String(e.usuario||'').trim().toLowerCase()===yo)||(!!normPlaca(ses.usuario)&&normPlaca(u.placa)===normPlaca(ses.usuario));
}
function puedoEditar(u){
  const p=permiso();
  if(p==='todo')return true;
  if(p==='ver')return false;
  return esMio(u)||!(u&&u.equipo||[]).length;        // camión sin equipo elegido: transición
}
/* camiones del día donde este usuario es parte del equipo */
function misUnidades(){
  const out=[];((datos&&datos.programaciones)||[]).forEach(p=>p.unidades.forEach(u=>{if(esMio(u))out.push({p,u});}));return out;
}
function equipoTxt(u){
  const eq=(u&&u.equipo)||[];
  if(!eq.length)return u&&u.personal?titulo(u.personal):'';
  return eq.map(e=>titulo(String(e.nombre||e.usuario).split(/\s+/).slice(0,2).join(' '))).join(' · ');
}

/* ---------- datos de la ruta seleccionada ---------- */
function progActual(){return datos&&datos.programaciones?datos.programaciones.find(p=>p.prog===sel.prog):null;}
function unidadActual(prog){prog=prog||progActual();if(!prog)return null;return prog.unidades.find(u=>normPlaca(u.placa)===normPlaca(sel.placa))||null;}
function paradasDe(prog,u){
  const ps=prog.pedidos.filter(p=>p.unitId===u.id).sort((a,b)=>(a.seq||999)-(b.seq||999)||a.id-b.id);
  /* una parada = mismo cliente en el mismo distrito, aunque el planificador haya
     dejado sus facturas separadas en la secuencia; queda donde aparece la primera */
  const out=[],idx=new Map();
  ps.forEach(p=>{
    const k=claveParada(p);let s=idx.get(k);
    if(!s){s={k,peds:[]};idx.set(k,s);out.push(s);}
    s.peds.push(p);
  });
  out.forEach((s,i)=>{
    s.n=i+1;                                   // N° programado por el supervisor
    s.key=facKey(s.peds[0]);
    s.est=s.peds.map(p=>estadoDe(claveDe(prog.prog,p)));
    s.estado=estadoParada(s.est.map(e=>e.estado));
    const ords=s.peds.map(p=>ordenDe(claveDe(prog.prog,p))).filter(Boolean);
    s.orden=ords.length?Math.min(...ords):0;   // N° que puso el chofer
    s.conf=s.peds.some(p=>confirmadoDe(claveDe(prog.prog,p)));
  });
  /* primero las que el chofer ya numeró (1, 2, 3…), luego el resto en el orden programado */
  out.sort((a,b)=>(a.orden||1e6)-(b.orden||1e6)||a.n-b.n);
  return out;
}
function estadoParada(lista){
  if(lista.some(e=>e==='EN PROCESO'))return 'EN PROCESO';
  if(lista.every(e=>FINAL[e])){
    if(lista.every(e=>e==='ANULADO'))return 'ANULADO';
    if(lista.every(e=>e==='TERMINADO'))return 'TERMINADO';
    return 'ENTREGA PARCIAL';
  }
  if(lista.some(e=>FINAL[e]))return 'EN PROCESO';      // a medias: sigue en atención
  return 'EN RUTA';
}

/* ---------- carga desde el servidor ---------- */
let enCarga=false;
async function cargar(dia,silencioso){
  dia=dia||sel.fechaDia||hoyLima();
  if(enCarga&&silencioso)return false;   // ya hay una consulta en camino
  enCarga=true;
  try{
    const r=await pedir({accion:'estadoRuta',fechaDia:dia},30000);
    if(!r.ok){
      if(esAuth(r.error)){cerrarSesion('Tu usuario o contraseña ya no son válidos. Vuelve a ingresar.');return false;}
      throw new Error(r.error||'respuesta inválida');
    }
    datos=r;ultimaCarga=Date.now();ultimoError='';
    indexarServidor(r.estados);
    guardar(K.cache,r);
    sel.fechaDia=r.fechaDia;
    elegirAutomatico();
    errEnv='';if(esDeRed(errFoto))errFoto='';   // la señal volvió
    pintar();
    return true;
  }catch(e){
    ultimoError=e.message;
    if(!silencioso)toast('No se pudo actualizar la ruta: '+e.message,true);
    if(!datos)pintar();
    errEnv=e.message;pintarSync();
    return false;
  }finally{enCarga=false;}
}
/* el camión se elige solo si el usuario es la placa (ej. BVN766) o si ya se había elegido */
function elegirAutomatico(){
  const progs=(datos&&datos.programaciones)||[];
  const tiene=(p,pl)=>p.unidades.some(u=>normPlaca(u.placa)===normPlaca(pl));
  let placa=sel.placa;
  if(!placa||!progs.some(p=>tiene(p,placa))){
    const mia=normPlaca(ses&&ses.usuario);
    placa=null;
    for(const p of progs)for(const u of p.unidades)if(mia&&normPlaca(u.placa)===mia)placa=u.placa;
    /* chofer o auxiliar: entra a su camión (el que le asignaron en el planificador) */
    if(!placa){const m=misUnidades();if(m.length)placa=m[0].u.placa;}
  }
  sel.placa=placa||null;
  if(placa){
    const suyas=progs.filter(p=>tiene(p,placa));
    /* si está en los dos turnos con camiones distintos, se queda con el turno donde está su equipo */
    if(!suyas.some(p=>p.prog===sel.prog)){
      /* turno por defecto: el primero que aún tenga algo por atender */
      const conPend=suyas.find(p=>paradasDe(p,p.unidades.find(u=>normPlaca(u.placa)===normPlaca(placa))).some(s=>!FINAL[s.estado]));
      sel.prog=(conPend||suyas[suyas.length-1]).prog;
    }
  }else sel.prog=null;
  guardar(K.sel,sel);
}

/* ---------- registrar un cambio ---------- */
function datosCambio(prog,u,p,ts){
  return {cid:nuevoId(),clave:claveDe(prog.prog,p),prog:prog.prog,fechaDia:prog.fechaDia,turno:prog.turno,
    placa:u.placa,ruta:u.ruta,personal:u.personal,seq:p.seq,factura:p.FACTURA||'',pedidoId:p.id,
    cliente:p.CLIENTES,distrito:p.DISTRITO,ts};
}
/* si el chofer atiende un cliente al que no le puso número, recibe el siguiente libre:
   así el orden de visita nunca queda vacío */
function autoOrden(prog,u,peds,ts){
  const par=paradasDe(prog,u);
  const tocadas=par.filter(s=>!s.orden&&s.peds.some(p=>peds.includes(p)));
  if(!tocadas.length)return;
  let max=par.reduce((m,s)=>Math.max(m,s.orden||0),0);
  tocadas.forEach(s=>{max++;s.peds.forEach(p=>cola.push(Object.assign(datosCambio(prog,u,p,ts),{soloOrden:true,orden:max})));});
}
function registrar(prog,u,peds,estado,motivo,detalle,conDeshacer){
  if(!puedoEditar(u)){toast('Esta ruta es de otro equipo: solo puedes verla.',true);return;}
  /* foto obligatoria: Terminado y Entrega parcial solo con la foto de la guía firmada */
  if(sinFotoPara(prog,peds,estado).length){
    const s=paradasDe(prog,u).find(x=>x.peds.some(p=>peds.includes(p)));
    if(s){abrirFotos(prog,u,s,{peds,estado,motivo:motivo||'',detalle:detalle||''});return;}
  }
  const ts=Date.now();const antes=[];
  if(estado!=='EN RUTA')autoOrden(prog,u,peds,ts);
  peds.forEach(p=>{
    const clave=claveDe(prog.prog,p);
    const prev=estadoDe(clave);
    antes.push({p,prev});
    cola.push({cid:nuevoId(),clave,prog:prog.prog,fechaDia:prog.fechaDia,turno:prog.turno,
      placa:u.placa,ruta:u.ruta,personal:u.personal,seq:p.seq,factura:p.FACTURA||'',pedidoId:p.id,
      cliente:p.CLIENTES,distrito:p.DISTRITO,estado,motivo:motivo||'',detalle:detalle||'',ts,
      lat:ultimaPos&&ts-ultimaPos.t<600000?ultimaPos.lat:null,lng:ultimaPos&&ts-ultimaPos.t<600000?ultimaPos.lng:null});
  });
  guardar(K.cola,cola);
  ubicar();
  pintar();
  programarEnvio(250);
  const txt=(peds.length>1?peds.length+' facturas':'Factura '+(peds[0].FACTURA||'sin número'))+': '+(typeof TXT_EST!=='undefined'?TXT_EST[estado]:estado).toLowerCase();
  if(conDeshacer)toast(txt,false,()=>{
    antes.forEach(a=>registrar(prog,u,[a.p],a.prev.estado,a.prev.motivo,a.prev.detalle,false));
    toast('Se deshizo el cambio');
  });else toast(txt);
}

/* ---------- novedades de una parada ----------
   Las del servidor (datos.incidencias) + las que siguen en la cola del celular,
   menos las que se pidió quitar. Una novedad toca la parada si comparte factura. */
function novedadesDe(prog,s){
  const fks=new Set(s.peds.map(facKey));
  const quitar=new Set(cola.filter(c=>c.borrarInc).map(c=>String(c.borrarInc)));
  const toca=i=>i.prog===prog.prog&&(i.facturas||[]).some(f=>fks.has(f));
  const out=((datos&&datos.incidencias)||[]).filter(i=>toca(i)&&!quitar.has(String(i.id))).map(i=>Object.assign({},i,{pend:false}));
  cola.filter(c=>c.incidencia&&c.prog===prog.prog&&(c.facturas||[]).some(f=>fks.has(String(f.factura||'').trim().toUpperCase()||('ID'+f.pedidoId))))
    .forEach(c=>{if(!out.some(i=>String(i.id)===String(c.cid)))out.push({id:c.cid,prog:c.prog,tipo:c.incidencia.tipo,detalle:c.incidencia.detalle,minutos:c.incidencia.minutos||0,
      usuario:ses&&ses.usuario,nombre:ses&&ses.nombre,hora:'~'+horaLima(c.ts),ts:c.ts,pend:true});});
  return out.sort((a,b)=>(+a.ts||0)-(+b.ts||0));
}
function registrarNovedad(prog,u,s,tipo,detalle,minutos){
  if(!puedoEditar(u)){toast('Esta ruta es de otro equipo: solo puedes verla.',true);return;}
  const p0=s.peds[0],ts=Date.now();
  cola.push(Object.assign(datosCambio(prog,u,p0,ts),{soloOrden:true,incidencia:{tipo,detalle,minutos:+minutos||0},
    facturas:s.peds.map(p=>({factura:p.FACTURA||'',pedidoId:p.id})),
    lat:ultimaPos&&ts-ultimaPos.t<600000?ultimaPos.lat:null,lng:ultimaPos&&ts-ultimaPos.t<600000?ultimaPos.lng:null}));
  guardar(K.cola,cola);ubicar();pintar();programarEnvio(250);
  toast('Novedad registrada: '+novInfo(tipo).l.toLowerCase());
}
function quitarNovedad(prog,u,s,inc){
  if(inc.pend){cola=cola.filter(c=>c.cid!==inc.id);guardar(K.cola,cola);pintar();toast('Novedad quitada');return;}
  const p0=s.peds[0];
  cola.push(Object.assign(datosCambio(prog,u,p0,Date.now()),{soloOrden:true,borrarInc:inc.id}));
  guardar(K.cola,cola);pintar();programarEnvio(250);toast('Novedad quitada');
}

/* =====================================================================
   FOTOS DE LA GUÍA FIRMADA
   · La cámara abre directo (o la galería). El celular reduce la foto a
     unos 200-400 KB y le agrega abajo un sello: factura, cliente, fecha,
     hora, placa, ruta, ubicación y usuario. La firma no queda tapada.
   · La foto espera en el celular (IndexedDB) y se sube sola, una a una,
     aunque se cierre la app o no haya señal. En el servidor va a Drive y en
     la factura solo queda su ID.
   · Una misma foto puede servir para varias facturas de la parada.
   ===================================================================== */
/* v24: más resolución para que se lea la letra chica de la guía (A4 a ~2400 px ≈ 200 ppp) */
const FOTO_LADO=2400, FOTO_MAX=900*1024, FOTO_Q=0.86, FOTO_QMIN=0.74;
/* señal débil: si una foto no logra subir, se vuelve a comprimir más liviana.
   Nivel 1 tras 2 intentos fallidos (~1800 px, 450 KB), nivel 2 tras 4 (~1400 px, 240 KB). */
const FOTO_NIVELES=[null,{tras:2,lado:1800,max:450*1024},{tras:4,lado:1400,max:240*1024}];
const NECESITA_FOTO={'TERMINADO':1,'ENTREGA PARCIAL':1};
const fotoMiniUrl={}, fotoVista={}, fotoVistaOrden=[];
let fdbP=null, sinIDB=false, fotoDestino=null, fotoProcesando=false, tFotos=null, visorCtx=null;

/* ---- almacén del celular para las fotos pendientes ---- */
function fdb(){
  if(fdbP)return fdbP;
  fdbP=new Promise((res,rej)=>{
    if(!window.indexedDB)return rej(new Error('sin IndexedDB'));
    const r=indexedDB.open('miruta_fotos',1);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('fotos'))r.result.createObjectStore('fotos',{keyPath:'cid'});};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('IndexedDB'));
  });
  return fdbP;
}
function fdbTx(modo,fn){
  return fdb().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction('fotos',modo);let out;
    const q=fn(tx.objectStore('fotos'));if(q)q.onsuccess=()=>{out=q.result;};
    tx.oncomplete=()=>res(out);tx.onerror=tx.onabort=()=>rej(tx.error||new Error('no se pudo guardar en el celular'));
  }));
}
async function cargarFotosCola(){
  try{const l=await fdbTx('readonly',st=>st.getAll());
    fotoCola=(l||[]).filter(f=>f&&f.blob&&Array.isArray(f.claves)).sort((a,b)=>a.ts-b.ts);}
  catch(e){sinIDB=true;}
  if(ses&&fotoCola.length){pintar();programarFotos(800);}
}
async function sacarDeCola(f){
  fotoCola=fotoCola.filter(x=>x.cid!==f.cid);soltarMini(f.cid);
  try{await fdbTx('readwrite',st=>st.delete(f.cid));}catch(e){}
}
function miniUrl(cid){
  if(fotoMiniUrl[cid])return fotoMiniUrl[cid];
  const f=fotoCola.find(x=>x.cid===cid);if(!f)return '';
  return fotoMiniUrl[cid]=URL.createObjectURL(f.blob);
}
function soltarMini(cid){if(fotoMiniUrl[cid]){URL.revokeObjectURL(fotoMiniUrl[cid]);delete fotoMiniUrl[cid];}}
/* imágenes ya vistas (las del servidor): se guardan unas pocas en memoria */
function guardarVista(id,url){
  if(fotoVista[id])return;
  fotoVista[id]=url;fotoVistaOrden.push(id);
  while(fotoVistaOrden.length>16){const v=fotoVistaOrden.shift();if(String(fotoVista[v]).startsWith('blob:'))URL.revokeObjectURL(fotoVista[v]);delete fotoVista[v];}
}

/* ---- qué fotos tiene cada factura (servidor + las que esperan en el celular) ---- */
function fotosDe(clave){
  const s=srv[clave];
  /* una foto que se está cambiando ya no se muestra: la reemplaza la nueva que espera en el celular */
  const cambiadas=new Set();fotoCola.forEach(f=>{if(f.reemplaza)cambiadas.add(f.reemplaza);if(f.reemplazaCid)cambiadas.add(f.reemplazaCid);});
  const out=((s&&s.fotos)||[]).filter(f=>!cambiadas.has(f.id)).map(f=>({id:f.id,ts:+f.ts||0,usuario:f.usuario||'',pend:false}));
  fotoCola.forEach(f=>{if(f.claves.includes(clave)&&!cambiadas.has(f.cid))out.push({cid:f.cid,ts:f.ts,usuario:f.usuario||'',pend:true});});
  return out.sort((a,b)=>a.ts-b.ts);
}
function fotosDePeds(prog,peds){
  if(!prog)return [];
  const vistos=new Set(),out=[];
  peds.forEach(p=>fotosDe(claveDe(prog.prog,p)).forEach(f=>{const k=f.id||f.cid;if(!vistos.has(k)){vistos.add(k);out.push(f);}}));
  return out.sort((a,b)=>a.ts-b.ts);
}
function fotosParada(prog,s){return fotosDePeds(prog,s.peds);}
/* facturas entregadas (total o parcial) que todavía no tienen foto */
function faltanFotos(prog,s){
  if(!prog)return [];
  return s.peds.filter((p,i)=>NECESITA_FOTO[s.est[i].estado]&&!fotosDe(claveDe(prog.prog,p)).length);
}
/* facturas entregadas de la parada para las que esta foto es la única: quitarla las dejaría sin evidencia */
function unicaEn(prog,s,f){
  const k=f.id||f.cid;
  return s.peds.filter((p,i)=>{const fs=fotosDe(claveDe(prog.prog,p));
    return NECESITA_FOTO[s.est[i].estado]&&fs.length===1&&(fs[0].id||fs[0].cid)===k;});
}
/* la foto de la guía es obligatoria para todos en Mi Ruta (chofer, auxiliar y también supervisor).
   Una corrección sin foto solo se hace desde el planificador. */
function fotoObligatoria(){return true;}
function sinFotoPara(prog,peds,estado){
  if(!fotoObligatoria()||!NECESITA_FOTO[estado]||!prog)return [];
  return peds.filter(p=>!fotosDe(claveDe(prog.prog,p)).length);
}
/* con la hoja de fotos abierta por una entrega pendiente: si ya están todas las fotos, se marca */
function revisarPendiente(){
  const h=hojaCtx;if(!h||h.modo!=='foto'||!h.pend)return;
  if(sinFotoPara(h.prog,h.pend.peds,h.pend.estado).length)return;
  const a=h.pend,prog=h.prog,u=h.u;h.pend=null;
  cerrarHoja();vibrar([18,40,18]);
  registrar(prog,u,a.peds,a.estado,a.motivo,a.detalle,true);
}
function fotoBadge(prog,p,estado){
  if(!prog)return '';
  const f=fotosDe(claveDe(prog.prog,p));
  if(!f.length)return '';

}
function fechaHoraLima(ms){
  return new Date(ms).toLocaleString('es-PE',{timeZone:'America/Lima',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).replace(',','');
}

/* ---- tomar la foto ---- */
function pedirFoto(prog,u,s,peds,deGaleria,reemplaza){
  if(!puedoEditar(u)){toast('Esta ruta es de otro equipo: solo puedes verla.',true);return;}
  fotoDestino={prog,u,s,peds,reemplaza:reemplaza||null};
  ubicar();                                   // para que el sello lleve la ubicación
  const inp=document.getElementById(deGaleria?'galeria':'camara');
  inp.value='';inp.click();
}
['camara','galeria'].forEach(id=>document.getElementById(id).addEventListener('change',async ev=>{
  const file=ev.target.files&&ev.target.files[0],dest=fotoDestino;
  fotoDestino=null;
  if(!file||!dest)return;
  fotoProcesando=true;refrescarHojaFoto();
  try{await guardarFoto(dest,file);}
  catch(e){toast('No se pudo preparar la foto: '+e.message,true);}
  finally{fotoProcesando=false;ev.target.value='';refrescarHojaFoto();}
}));
async function guardarFoto(dest,file){
  const {prog,u,peds}=dest,ts=Date.now();
  const pos=ultimaPos&&ts-ultimaPos.t<600000?ultimaPos:null;
  const blob=await prepararFoto(file,{
    l1:peds.map(p=>p.FACTURA||'Sin número').join(' · ')+'   '+String(peds[0].CLIENTES||'').trim(),
    l2:fechaHoraLima(ts)+'  ·  '+(u.placa||'')+(u.ruta?' · Ruta '+u.ruta:'')+(pos?'  ·  '+pos.lat.toFixed(5)+', '+pos.lng.toFixed(5):'')+'  ·  '+(ses&&ses.usuario||'')
  });
  const f={cid:'f'+nuevoId(),prog:prog.prog,fechaDia:prog.fechaDia,placa:u.placa,
    claves:peds.map(p=>claveDe(prog.prog,p)),facturas:peds.map(p=>({factura:p.FACTURA||'',pedidoId:p.id})),
    cliente:peds[0].CLIENTES||'',ts,blob,usuario:ses&&ses.usuario,lat:pos?pos.lat:null,lng:pos?pos.lng:null};
  /* "Cambiar foto": la vieja se desvincula en el servidor recién cuando la nueva ya está guardada */
  const vieja=dest.reemplaza;
  if(vieja){
    if(!vieja.pend)f.reemplaza=vieja.id;
    else{
      const it=fotoCola.find(x=>x.cid===vieja.cid);
      if(it&&subiendo&&fotoCola[0]===it)f.reemplazaCid=it.cid;     // se está enviando: se cambia al terminar
      else if(it)await sacarDeCola(it);
    }
  }
  try{await fdbTx('readwrite',st=>st.put(f));}catch(e){sinIDB=true;}
  fotoCola.push(f);
  vibrar([14,30,14]);pintar();programarFotos(200);
  if(vieja){refrescarHojaFoto();toast('Foto cambiada'+(navigator.onLine===false?': se envía sola al volver la señal':''));return;}
  if(hojaCtx&&hojaCtx.pend){revisarPendiente();if(!hojaCtx||!hojaCtx.pend)return;}
  toast(sinIDB?'Foto lista. No cierres la app hasta que se envíe.'
    :navigator.onLine===false?'Foto guardada en el celular: se envía sola al volver la señal':'Foto guardada · enviándose');
}
/* reduce la foto y le agrega el sello; la orientación del celular se respeta */
async function prepararFoto(file,sello){
  let src=null,w=0,h=0,cerrar=()=>{};
  try{
    if(window.createImageBitmap){const bm=await createImageBitmap(file,{imageOrientation:'from-image'});src=bm;w=bm.width;h=bm.height;cerrar=()=>{try{bm.close();}catch(e){}};}
  }catch(e){src=null;}
  if(!src){
    const url=URL.createObjectURL(file);
    src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('el celular no pudo leer la imagen'));i.src=url;});
    w=src.naturalWidth;h=src.naturalHeight;cerrar=()=>URL.revokeObjectURL(url);
  }
  if(!w||!h){cerrar();throw new Error('la imagen está vacía');}
  try{await document.fonts.load('700 20px Barlow');}catch(e){}
  try{
    let lado=FOTO_LADO,q=FOTO_Q;
    for(let intento=0;intento<8;intento++){
      const k=Math.min(1,lado/Math.max(w,h));
      const cv=dibujarSello(src,Math.round(w*k),Math.round(h*k),sello);
      const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));
      cv.width=cv.height=0;                       // libera memoria en celulares modestos
      if(!b)throw new Error('no se pudo comprimir');
      if(b.size<=FOTO_MAX||intento===7)return b;
      /* primero baja un poco la calidad; después la resolución, sin pasar de ~1700 px */
      if(q-0.06>=FOTO_QMIN)q-=0.06;else if(lado>1700)lado=Math.max(1700,Math.round(lado*0.88));else q=Math.max(0.6,q-0.06);
    }
  }finally{cerrar();}
}
function dibujarSello(src,W,H,sello){
  const banda=Math.round(Math.max(64,W*0.075));
  const cv=document.createElement('canvas');cv.width=W;cv.height=H+banda;
  const cx=cv.getContext('2d');
  cx.fillStyle='#fff';cx.fillRect(0,0,W,H);
  cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality='high';      // reducción nítida
  /* un poco más de contraste: la tinta de la firma y el sello resaltan sobre el papel */
  try{cx.filter='contrast(1.12) saturate(1.05)';}catch(e){}
  cx.drawImage(src,0,0,W,H);
  try{cx.filter='none';}catch(e){}
  cx.fillStyle='#1a1a1a';cx.fillRect(0,H,W,banda);
  cx.fillStyle='#E1001A';cx.fillRect(0,H,W,Math.max(3,Math.round(banda*0.07)));
  const pad=Math.round(banda*0.22),f1=Math.round(banda*0.3),f2=Math.round(banda*0.235);
  cx.textBaseline='alphabetic';
  cx.fillStyle='#fff';cx.font=`700 ${f1}px Barlow, Roboto, Arial, sans-serif`;
  cx.fillText(cortarTexto(cx,'GUÍA FIRMADA · '+sello.l1,W-pad*2),pad,H+Math.round(banda*0.5));
  cx.fillStyle='#c9ced5';cx.font=`500 ${f2}px Barlow, Roboto, Arial, sans-serif`;
  cx.fillText(cortarTexto(cx,sello.l2,W-pad*2),pad,H+Math.round(banda*0.84));
  return cv;
}
function cortarTexto(cx,t,max){
  if(cx.measureText(t).width<=max)return t;
  while(t.length>1&&cx.measureText(t+'…').width>max)t=t.slice(0,-1);
  return t+'…';
}

/* ---- subida: una foto a la vez, con reintento solo ---- */
function programarFotos(ms){clearTimeout(tFotos);tFotos=setTimeout(subirFotos,ms);}
function blobAData(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('no se pudo leer la foto guardada'));r.readAsDataURL(b);});}
async function subirFotos(){
  if(subiendo||!fotoCola.length||!ses)return;
  subiendo=true;pintarSync();
  const f=fotoCola[0];
  try{
    const r=await pedir({accion:'fotoSubir',cid:f.cid,prog:f.prog,facturas:f.facturas,ts:f.ts,lat:f.lat,lng:f.lng,
      reemplaza:f.reemplaza||'',foto:{datos:await blobAData(f.blob)}},90000);
    if(!r.ok){
      if(esAuth(r.error)){subiendo=false;cerrarSesion('Tu sesión ya no es válida. Ingresa de nuevo: las fotos pendientes se conservan.');return;}
      if(!r.definitivo){const er=new Error(r.error||'respuesta inválida');er.servidor=true;throw er;}
      await sacarDeCola(f);
      toast('Una foto no se guardó: '+r.error,true);
      if(r.ajeno)setTimeout(()=>cargar(null,true),200);
    }else{
      /* la vista previa del celular sirve para ver la foto ya subida sin descargarla */
      if(r.id&&fotoMiniUrl[f.cid]){guardarVista(r.id,fotoMiniUrl[f.cid]);delete fotoMiniUrl[f.cid];}
      (r.estados||[]).forEach(mezclarServidor);
      await sacarDeCola(f);
      /* si mientras subía la cambiaron por otra, la nueva la reemplaza en el servidor */
      for(const x of fotoCola)if(x.reemplazaCid===f.cid&&r.id){x.reemplaza=r.id;delete x.reemplazaCid;try{await fdbTx('readwrite',st=>st.put(x));}catch(e){}}
    }
    subiendo=false;if(r.ok)errFoto='';pintar();refrescarHojaFoto();
    if(fotoCola.length)programarFotos(400);
  }catch(e){
    subiendo=false;errFoto=e.message;pintarSync();
    let espera=e.servidor&&/desconocida|permiso de Drive|autorizarFotos/i.test(e.message)?60000:25000;
    /* solo cuenta como señal débil si el celular tiene red pero el envío no llegó a tiempo o se cortó */
    if(navigator.onLine!==false&&/no respondió a tiempo|sin conexión|respondió 5\d\d/i.test(e.message)&&fotoCola.includes(f)){
      f.fallos=(f.fallos||0)+1;
      let nivel=f.nivel||0;
      for(let n=1;n<FOTO_NIVELES.length;n++)if(f.fallos>=FOTO_NIVELES[n].tras)nivel=n;
      if(nivel>(f.nivel||0)){
        try{
          const b=await reducirFoto(f.blob,FOTO_NIVELES[nivel]);
          if(b&&b.size<f.blob.size){f.blob=b;soltarMini(f.cid);}
          f.nivel=nivel;espera=2500;                 // reintenta enseguida, ya más liviana
        }catch(e2){}
      }
      try{await fdbTx('readwrite',st=>st.put(f));}catch(e3){}
    }
    refrescarHojaFoto();
    programarFotos(espera);
  }
}
/* vuelve a comprimir una foto ya sellada (el sello va en la imagen, así que se conserva) */
async function reducirFoto(blob,{lado,max}){
  let src=null,w=0,h=0,cerrar=()=>{};
  try{if(window.createImageBitmap){const bm=await createImageBitmap(blob);src=bm;w=bm.width;h=bm.height;cerrar=()=>{try{bm.close();}catch(e){}};}}catch(e){src=null;}
  if(!src){
    const url=URL.createObjectURL(blob);
    src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('no se pudo leer'));i.src=url;});
    w=src.naturalWidth;h=src.naturalHeight;cerrar=()=>URL.revokeObjectURL(url);
  }
  try{
    let L=lado,q=0.72,mejor=null;
    for(let intento=0;intento<7;intento++){
      const k=Math.min(1,L/Math.max(w,h)),W=Math.round(w*k),H=Math.round(h*k);
      const cv=document.createElement('canvas');cv.width=W;cv.height=H;
      cv.getContext('2d').drawImage(src,0,0,W,H);
      const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));
      cv.width=cv.height=0;
      if(b&&(!mejor||b.size<mejor.size))mejor=b;
      if(b&&b.size<=max)return b;
      if(q>0.53)q-=0.1;else L=Math.round(L*0.85);
    }
    return mejor;
  }finally{cerrar();}
}

    <p class="foto-guia">Que se lean la firma, el sello y la fecha del cliente. Si el cliente no firma, toma la foto igual y registra una novedad. La foto se envía sola; sin señal espera en el celular.</p>

/* ---- visor a pantalla completa ---- */

/* toma una foto nueva para las mismas facturas; la vieja se reemplaza al guardarla */
function cambiarFoto(){
  const c=visorCtx;if(!c)return;const f=c.foto,k=f.id||f.cid;
  const s=paradasDe(c.ctx.prog,c.ctx.u).find(x=>x.key===c.ctx.s.key)||c.ctx.s;
  const peds=s.peds.filter(p=>fotosDe(claveDe(c.ctx.prog.prog,p)).some(x=>(x.id||x.cid)===k));
  if(!peds.length){cerrarVisor();return;}
  vibrar(8);
  pedirFoto(c.ctx.prog,c.ctx.u,s,peds,false,f.pend?{pend:true,cid:f.cid}:{pend:false,id:f.id});   // abre la cámara (mismo toque)

async function quitarFoto(){
  const c=visorCtx;if(!c)return;const f=c.foto;
  {const sAct=paradasDe(c.ctx.prog,c.ctx.u).find(x=>x.key===c.ctx.s.key)||c.ctx.s;
   if(fotoObligatoria()&&unicaEn(c.ctx.prog,sAct,f).length){toast('Es la única foto de una factura entregada: cámbiala por otra.',true);return;}}
  const ok=await dialogo('¿Quitar esta foto?',f.pend?'Todavía no se envió: se borra de este celular.':'Dejará de verse en la factura. En Drive queda guardada como respaldo.','Quitar','Dejarla');
  if(!ok||!visorCtx)return;
  if(f.pend){
    const it=fotoCola.find(x=>x.cid===f.cid);if(it)await sacarDeCola(it);
    cerrarVisor();pintar();refrescarHojaFoto();toast('Foto quitada');return;
  }
  try{
    const r=await pedir({accion:'fotoQuitar',id:f.id,prog:c.ctx.prog.prog},30000);
    if(!r.ok)throw new Error(r.error||'respuesta inválida');
    (r.estados||[]).forEach(mezclarServidor);
    cerrarVisor();pintar();refrescarHojaFoto();toast('Foto quitada');
  }catch(e){toast('No se pudo quitar: '+e.message,true);}
}

/* ---------- envío (con cola si no hay señal) ---------- */
let tEnvio=null;
function programarEnvio(ms){clearTimeout(tEnvio);tEnvio=setTimeout(enviar,ms);}
async function enviar(){
  if(enviando||!cola.length||!ses)return;
  enviando=true;pintarSync();
  const lote=cola.slice(0,150);
  try{
    const r=await pedir({accion:'estadoGuardar',cambios:lote});
    if(!r.ok){
      if(esAuth(r.error)){enviando=false;cerrarSesion('Tu sesión ya no es válida. Ingresa de nuevo: los cambios pendientes se conservan.');return;}
      throw new Error(r.error||'respuesta inválida');
    }
    const listos=new Set([...(r.aceptados||[]),...(r.rechazados||[])].map(x=>x.cid));
    cola=cola.filter(c=>!listos.has(c.cid));guardar(K.cola,cola);
    (r.estados||[]).forEach(mezclarServidor);
    /* novedades: el servidor devuelve todas las de las programaciones del envío */
    if(Array.isArray(r.incidencias)&&datos){
      const progs=new Set(lote.map(c=>c.prog));
      datos.incidencias=(datos.incidencias||[]).filter(i=>!progs.has(i.prog)).concat(r.incidencias.filter(i=>progs.has(i.prog)));
      guardar(K.cache,datos);
    }
    if(r.rechazados&&r.rechazados.length){
      const bloq=r.rechazados.some(x=>x.bloqueado);
      const ajeno=r.rechazados.some(x=>x.ajeno);
      toast(bloq?'Otra persona ya confirmó el orden de este camión. Se muestra el orden vigente.':ajeno?'Ese cambio no se guardó: '+r.rechazados.find(x=>x.ajeno).error+'.':'El servidor no aceptó '+r.rechazados.length+' cambio(s): '+r.rechazados[0].error,true);
      if(bloq||ajeno)setTimeout(()=>cargar(null,true),200);   // traer lo vigente
    }
    enviando=false;errEnv='';pintar();
    if(cola.length)programarEnvio(300);
  }catch(e){
    enviando=false;errEnv=e.message;pintarSync();
    programarEnvio(20000);              // reintenta solo
  }
}

/* ---------- ubicación: se adjunta al cambio si el celular la da ---------- */
function ubicar(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(pos=>{
    ultimaPos={lat:+pos.coords.latitude.toFixed(6),lng:+pos.coords.longitude.toFixed(6),t:Date.now()};
    /* completa los cambios recientes que salieron sin ubicación y aún no se envían */
    let tocado=false;
    cola.forEach(c=>{if(c.lat==null&&Date.now()-c.ts<180000){c.lat=ultimaPos.lat;c.lng=ultimaPos.lng;tocado=true;}});
    if(tocado)guardar(K.cola,cola);
  },()=>{},{enableHighAccuracy:true,timeout:8000,maximumAge:120000});
}

let nav={tab:'ruta',pila:[]};
const scrolls={};
let saltarPop=0;
function cimaPila(){return nav.pila[nav.pila.length-1]||null;}
function vistaActual(){
  if(!ses)return 'login';
  if(!datos)return 'cargando';
  const top=cimaPila();if(top)return top.v;
  const prog=progActual(),u=unidadActual(prog);
  if(!prog||!u)return 'camiones';
  return nav.tab;
}
function claveVista(){const t=cimaPila();return vistaActual()+(t&&t.key?':'+t.key:'');}
function irA(v,extra){
  scrolls[claveVista()]=window.scrollY;
  nav.pila.push(Object.assign({v},extra||{}));
  history.pushState({mr:nav.pila.length},'');
  pintar('adelante');
}
function atras(){history.back();}
function irTab(t){
  if(t===nav.tab&&!nav.pila.length){window.scrollTo({top:0,behavior:'smooth'});return;}
  if(nav.pila.length){volverARaiz(t);return;}
  scrolls[claveVista()]=window.scrollY;
  if(t==='ruta'){history.back();return;}               // desde Resumen/Más, "Mi ruta" es volver
  if(nav.tab==='ruta')history.pushState({tab:t},'');
  else history.replaceState({tab:t},'');
  nav.tab=t;pintar('fundido');
}
/* deja la app en la pantalla principal y limpia los pasos del historial */
function volverARaiz(tab){
  const n=nav.pila.length+(nav.tab!=='ruta'?1:0);
  nav.pila=[];nav.tab='ruta';
  if(n>0){saltarPop++;history.go(-n);}
  if(tab&&tab!=='ruta'){nav.tab=tab;setTimeout(()=>{history.pushState({tab},'');},60);}
  pintar('atras');
}
window.addEventListener('popstate',()=>{
  if(saltarPop>0){saltarPop--;return;}
  if(dlgAbierto){cerrarDialogo(false,true);return;}
  if(visorCtx){cerrarVisor(true);return;}
  if(hojaCtx){cerrarHoja(true);return;}
  if(nav.pila.length){
    const top=nav.pila.pop();
    if(top.v==='ordenar')ordenando=null;
    pintar('atras');return;
  }
  if(nav.tab!=='ruta'){nav.tab='ruta';pintar('atras');return;}
});

function pintar(dir){
  const v=vistaActual();
  const y=window.scrollY;
  document.body.classList.remove('con-tab','con-pie');
  if(v==='login')pintarLogin();
  else if(v==='cargando')pintarCargando();
  else if(v==='camiones')pintarCamiones();
  else if(v==='ordenar')pintarOrdenar();
  else if(v==='resumen')pintarResumen();
  else if(v==='mas')pintarMas();
  else pintarRuta();
  const p=app.querySelector('.pant');
  if(p&&dir)p.classList.add(dir);
  if(dir==='atras')window.scrollTo(0,scrolls[claveVista()]||0);
  else if(dir)window.scrollTo(0,0);
  else window.scrollTo(0,y);
}

    const fs=errFoto&&!esDeRed(errFoto)&&fotoCola.length?errFoto:'';

      const otra=await dialogo(x.t,x.d+(fotoCola.length?' Fotos por enviar: '+fotoCola.length+'.':''),'Reintentar ahora','Cerrar');
      if(!otra)return;}

  const a=document.getElementById('bAtras');if(a)a.onclick=atras;

/* ¿el error es de la señal o lo respondió el servidor? (si respondió, la señal está bien) */
let errEnv='',errFoto='';   // último error de los cambios y de las fotos (se borran al enviar bien)
function esDeRed(m){return /no respondió a tiempo|sin conexión|respondió [45]\d\d|no válida del servidor/i.test(String(m||''));}
function explicarError(m){
  m=String(m||'');
  if(/desconocida/i.test(m))return {t:'El servidor todavía no recibe fotos',d:'El Apps Script publicado no es la versión v13.1. Avísale al supervisor: debe pegar la v13.1, ejecutar "autorizarFotos" y publicar una Nueva versión. La foto queda guardada en este celular y se enviará sola cuando el servidor esté listo.'};
  if(/permiso de Drive|autorizarFotos/i.test(m))return {t:'Falta el permiso de Drive',d:'El supervisor debe abrir el Apps Script, ejecutar una vez la función "autorizarFotos" y aceptar el permiso. La foto queda guardada en este celular y se enviará sola después.'};
  if(/no respondió a tiempo/i.test(m))return {t:'La foto tarda en subir',d:'Hay señal, pero el envío no terminó a tiempo. La app la vuelve a intentar sola y, si sigue fallando, la envía más liviana. No cierres la sesión.'};
  if(esDeRed(m))return {t:'Sin señal',d:'La foto está guardada en este celular y se enviará sola cuando vuelva la conexión.'};
  return {t:'No se pudo enviar',d:'El servidor respondió: '+m+'. La app lo vuelve a intentar sola.'};
}
function pintarSync(error){
  const b=document.getElementById('sync');if(!b)return;
  const n=pendientes();
  if(!cola.length)errEnv='';if(!fotoCola.length)errFoto='';
  const fotoSrv=errFoto&&!esDeRed(errFoto)?errFoto:'';
  const er=fotoSrv||errEnv||errFoto;
  const etq=er?(esDeRed(er)&&!/no respondió a tiempo/i.test(er)?'Sin señal · '+n:'Foto sin subir · ver'):n+' por enviar';
  b.className='sync'+(enviando||subiendo?' envia':er?' err':n?' pend':'');
  b.innerHTML='<i></i>'+(enviando?'Enviando…':subiendo?'Subiendo foto…':n?etq:(ultimaCarga?'Al día '+horaLima(ultimaCarga):'Al día'));
  b.title=er?('Último intento: '+er):'Toca para actualizar';
}
