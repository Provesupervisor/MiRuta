<title>Mi Ruta · Provefabrica</title>
<style>
:root{
  --ink:#16181b;--muted:#5f6875;--line:#d6dae0;--bg:#eceef1;--card:#fff;
  --brand:#e1001a;--brand2:#b30015;--negro:#1a1a1a;
  --ruta:#5b6573;--ruta-bg:#eef0f3;
  --proc:#b45309;--proc-bg:#fff3dc;
  --term:#15803d;--term-bg:#e3f5e9;
  --parc:#6d28d9;--parc-bg:#efe8fd;
  --anul:#b91c1c;--anul-bg:#fdeaea;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
.oculto{display:none!important}
.app{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:calc(90px + var(--safe-b))}

/* ---------- cabecera ---------- */
.cab{background:var(--negro);color:#fff;padding:12px 16px 0;display:flow-root}
.cab-fila{display:flex;align-items:center;gap:10px}
.cab-marca{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:.01em}
.cab-marca svg{width:32px;height:32px;display:block;flex:none}
.cab-esp{flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:#cfd4da;background:#2b2d31;border:0;border-radius:99px;padding:6px 11px;min-height:34px}
.sync i{width:9px;height:9px;border-radius:50%;background:#22c55e;flex:none}
.sync.pend i{background:#f59e0b}
.sync.err i{background:#ef4444}
.sync.envia i{background:#60a5fa;animation:lat 1s infinite}
@keyframes lat{50%{opacity:.3}}
.menu-btn{background:none;border:0;color:#fff;font-size:22px;width:40px;height:40px;border-radius:10px;line-height:1}
.camion{display:flex;align-items:baseline;gap:10px;margin:12px 0 2px;flex-wrap:wrap}
.placa{font-size:30px;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.placa-sub{font-size:14px;color:#b8bec6}
.personal{font-size:13px;color:#8f969f;margin-bottom:12px}
.turnos{display:flex;gap:6px;margin:0 0 12px}
.turnos button{background:#2b2d31;border:0;color:#cfd4da;border-radius:8px;padding:7px 12px;font-size:14px}
.turnos button.on{background:#fff;color:var(--negro);font-weight:700}

/* tira de avance: un tramo por parada, con el color de su estado */
.tira-zona{background:var(--negro);padding:0 16px 14px}
.tira{display:flex;gap:3px;height:12px}
.tira span{flex:1;border-radius:3px;background:#3a3d42}
.tira span.EN_PROCESO{background:#f59e0b}
.tira span.TERMINADO{background:#22c55e}
.tira span.ENTREGA_PARCIAL{background:#a78bfa}
.tira span.ANULADO{background:#ef4444}
.tira span.actual{box-shadow:0 0 0 2px #fff}
.tira-txt{display:flex;justify-content:space-between;color:#cfd4da;font-size:14px;margin-top:8px}
.tira-txt b{color:#fff;font-size:17px}

/* ---------- filtros ---------- */
.filtros{display:flex;gap:8px;padding:14px 16px 4px}
.filtros button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 6px;font-size:15px;font-weight:600;color:var(--muted)}
.filtros button.on{border-color:var(--ink);color:var(--ink);background:#fff;box-shadow:inset 0 -3px 0 var(--brand)}
.conteos{display:flex;flex-wrap:wrap;gap:6px 12px;padding:6px 16px 0;font-size:13px;color:var(--muted)}
.conteos span{display:inline-flex;align-items:center;gap:5px}
.conteos i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- paradas en una línea de ruta ---------- */
.lista{padding:8px 16px 0}
.parada{display:grid;grid-template-columns:44px 1fr;column-gap:10px;position:relative}
.parada::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:2px;background:var(--line)}
.parada:first-child::before{top:22px}
.parada:last-child::before{bottom:auto;height:22px}
.num{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  font-weight:800;font-size:18px;background:#fff;border:2.5px solid var(--ruta);color:var(--ruta);margin-top:10px;font-variant-numeric:tabular-nums}
.p-EN_PROCESO .num{border-color:var(--proc);background:var(--proc);color:#fff}
.p-TERMINADO .num{border-color:var(--term);background:var(--term);color:#fff}
.p-ENTREGA_PARCIAL .num{border-color:var(--parc);background:var(--parc);color:#fff}
.p-ANULADO .num{border-color:var(--anul);background:var(--anul);color:#fff}
.tarjeta{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;padding:14px 14px 12px;min-width:0}
.p-EN_PROCESO .tarjeta{border:2px solid var(--proc);box-shadow:0 6px 18px rgba(180,83,9,.16)}
.parada.siguiente .tarjeta{border:2px solid var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.etq-sig{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--ink);border-radius:6px;padding:2px 8px;margin-bottom:6px}
.p-EN_PROCESO .etq-sig{background:var(--proc)}
.cli{font-size:18px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.meta{font-size:14px;color:var(--muted);margin-top:3px}
.tipo{display:inline-block;font-size:12px;font-weight:700;border-radius:5px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.tipo.PROVINCIA{background:#fff1e0;color:#9a4a07}.tipo.RETIRO{background:#efe8fd;color:#5b21b6}.tipo.LOCAL{background:#e8eef6;color:#1f4f7a}
.obs{margin-top:8px;font-size:14px;background:#fff8d6;border-left:4px solid #e0b000;border-radius:6px;padding:7px 10px}
.facs{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.fac{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:#fafbfc;border-radius:10px;padding:9px 10px;min-height:48px}
.fac-n{flex:1;min-width:0;font-weight:600;font-variant-numeric:tabular-nums}
.fac-n small{display:block;font-weight:400;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.est{flex:none;font-size:12px;font-weight:700;border-radius:7px;padding:5px 9px;white-space:nowrap}
.est.EN_RUTA{background:var(--ruta-bg);color:var(--ruta)}
.est.EN_PROCESO{background:var(--proc-bg);color:var(--proc)}
.est.TERMINADO{background:var(--term-bg);color:var(--term)}
.est.ENTREGA_PARCIAL{background:var(--parc-bg);color:var(--parc)}
.est.ANULADO{background:var(--anul-bg);color:var(--anul)}
.fac .flecha{color:#9aa1aa;font-size:18px}
.pend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b;margin-left:6px;vertical-align:1px}
.acciones{display:flex;gap:8px;margin-top:12px}
.acciones a,.acciones button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;border-radius:11px;
  font-weight:700;font-size:15px;text-decoration:none;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:8px}
.acciones .llegue{background:var(--proc);border-color:var(--proc);color:#fff}
.acciones .entregado{background:var(--term);border-color:var(--term);color:#fff}
.horas{font-size:13px;color:var(--muted);margin-top:8px}
.motivo-txt{font-size:13px;margin-top:4px;color:var(--anul)}
.detalle-txt{font-size:13px;margin-top:4px;color:var(--parc)}
.compacta .tarjeta{padding:10px 12px}
.compacta .cli{font-size:16px}
.compacta .num{width:36px;height:36px;font-size:15px;margin:8px 4px 0}
.num.sin-orden{border-style:dashed;color:#9aa1aa;border-color:#b8bec6}
.prog-n{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-left:4px;vertical-align:1px}
.orden-cta{margin:12px 16px 0;display:flex;align-items:center;gap:12px;width:calc(100% - 32px);text-align:left;border:2px dashed var(--ink);background:#fff;border-radius:14px;padding:12px 14px}
.orden-cta b{display:block;font-size:16px}
.orden-cta small{color:var(--muted);font-size:13px}
.orden-cta .ic{font-size:24px}
.orden-lock{margin:12px 16px 0;display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--muted)}
.orden-lock b{color:var(--ink)}
.ord-ayuda{margin:14px 16px 4px;background:#fff;border-left:5px solid var(--brand);border-radius:10px;padding:12px 14px;font-size:15px}
.ord-ayuda b{display:block;font-size:17px;margin-bottom:2px}
.ord-lista{padding:6px 16px 140px;display:flex;flex-direction:column;gap:8px}
.ord-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;min-height:64px}
.ord-item.on{border-color:var(--ink);background:#f7f8fa}
.ord-num{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:19px;border:2.5px dashed #b8bec6;color:#b8bec6}
.ord-item.on .ord-num{border:0;background:var(--ink);color:#fff}
.ord-item .tx{flex:1;min-width:0}
.ord-item .tx b{display:block;font-size:16px;overflow-wrap:anywhere}
.ord-item .tx small{color:var(--muted);font-size:13px}
.ord-pie{position:fixed;left:0;right:0;bottom:0;z-index:16;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + var(--safe-b))}
.ord-pie div{max-width:568px;margin:0 auto}
.ord-pie .fila{display:flex;gap:8px;margin-top:8px}
.ord-pie .fila button{flex:1;min-height:46px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-weight:600}
.ord-pie .btn-guardar{margin-top:0}
.vacio{text-align:center;color:var(--muted);padding:40px 24px}
.vacio b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}

/* ---------- hoja inferior para cambiar estado ---------- */
.velo{position:fixed;inset:0;background:rgba(10,12,15,.5);z-index:40}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:18px 18px 0 0;
  max-width:600px;margin:0 auto;padding:10px 16px calc(16px + var(--safe-b));max-height:92vh;overflow:auto;
  transform:translateY(0);transition:transform .2s ease}
.hoja.cerrada{transform:translateY(105%)}
@media (prefers-reduced-motion:reduce){.hoja{transition:none}}
.asa{width:42px;height:5px;border-radius:3px;background:#cfd4da;margin:0 auto 12px}
.hoja h3{margin:0;font-size:19px}
.hoja .sub{color:var(--muted);font-size:14px;margin:2px 0 12px}
.opciones{display:flex;flex-direction:column;gap:8px}
.opc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;min-height:58px}
.opc .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none;color:#fff}
.opc b{display:block;font-size:16px}
.opc small{color:var(--muted);font-size:13px}
.opc.actual{background:#f6f7f9}
.opc.actual::after{content:"actual";margin-left:auto;font-size:12px;color:var(--muted)}
.opc.marcada{border-color:var(--ink)}
.campo{margin-top:12px}
.campo label{display:block;font-weight:700;margin-bottom:6px}
.campo label em{font-style:normal;font-weight:400;color:var(--muted)}
.campo textarea{width:100%;min-height:84px;border:2px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical}
.campo textarea.falta{border-color:var(--anul);background:#fff7f7}
.rapidos{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.rapidos button{border:1px solid var(--line);background:#f6f7f9;border-radius:99px;padding:7px 12px;font-size:14px}
.todas{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px;padding:10px;border-radius:10px;background:#f6f7f9}
.todas input{width:22px;height:22px;accent-color:var(--ink)}
.btn-guardar{width:100%;margin-top:14px;min-height:54px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;font-size:17px}
.btn-sec{width:100%;margin-top:8px;min-height:48px;border:0;background:none;color:var(--muted);font-size:15px}

/* ---------- login y selección ---------- */
.portada{min-height:100vh;display:flex;flex-direction:column}
.portada-cab{background:var(--negro);padding:40px 24px 26px;color:#fff;border-bottom:5px solid var(--brand)}
.portada-cab img{height:22px;display:block;margin-bottom:26px}
.portada-marca{display:flex;align-items:center;gap:16px}
.portada-marca svg{width:72px;height:72px;display:block;flex:none}
.portada-cab h1{margin:0;font-size:32px;line-height:1.1}
.portada-cab p{margin:4px 0 0;color:#b8bec6}
.form{padding:22px 24px;max-width:460px;width:100%;margin:0 auto}
.form label{display:block;font-weight:700;margin:14px 0 6px}
.form input{width:100%;min-height:52px;border:2px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-size:17px;background:#fff}
.form .btn-guardar{margin-top:22px}
.aviso{border-radius:10px;padding:10px 12px;font-size:14px;margin-top:14px;background:#fdeaea;color:#8a1414}
.aviso.info{background:#e8eef6;color:#1f4f7a}
/* firma */
.firma{margin:26px auto 18px;padding:0 24px;max-width:460px;width:100%;text-align:center;font-size:12.5px;line-height:1.45;color:var(--muted)}
.firma::before{content:"";display:block;width:34px;height:3px;border-radius:2px;background:var(--brand);margin:0 auto 10px}
.firma b{color:var(--ink);font-weight:700}
.portada .firma{margin-top:auto;padding-bottom:calc(18px + var(--safe-b))}
body.con-inst .app .firma{padding-bottom:calc(120px + var(--safe-b))}
.menu .firma{margin:0;padding:4px 16px 12px;text-align:left;font-size:11.5px}
.menu .firma::before{display:none}
.ayuda{font-size:14px;color:var(--muted);margin-top:18px}
.unid{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.unid .pl{font-size:22px;font-weight:800}
.unid .ds{color:var(--muted);font-size:14px;margin-top:2px}
.unid .tira{margin-top:10px;height:8px}
.unid .tira span{background:#dfe3e8}

/* menú */
.menu{position:fixed;top:56px;right:max(12px,calc(50vw - 288px));z-index:30;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:230px;overflow:hidden}
.menu button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:14px 16px;font-size:15px;border-bottom:1px solid #eef0f3}
.menu .ver{font-size:12px;color:var(--muted);padding:10px 16px}

/* aviso flotante */
.toast{position:fixed;left:16px;right:16px;bottom:calc(18px + var(--safe-b));max-width:568px;margin:0 auto;z-index:50;
  background:#1f2328;color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.err{background:#8a1414}
.toast span{flex:1}
.toast button{border:0;background:none;color:#fbbf24;font-weight:700;font-size:15px;padding:6px}
/* tarjeta para instalar la app: solo aparece si el celular ofrece instalarla */
.inst{position:fixed;left:12px;right:12px;bottom:calc(14px + var(--safe-b));max-width:576px;margin:0 auto;z-index:40;
  background:var(--negro);color:#fff;border-radius:16px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:12px;
  box-shadow:0 12px 30px rgba(0,0,0,.35);border-left:5px solid var(--brand)}
.inst svg{width:44px;height:44px;flex:none;display:block}
.inst div{flex:1;min-width:0}
.inst b{display:block;font-size:15px}
.inst small{display:block;color:#b8bec6;font-size:13px;line-height:1.3;margin-top:2px}
.inst .inst-si{border:0;background:var(--brand);color:#fff;font-weight:700;font-size:15px;border-radius:10px;padding:11px 14px;flex:none}
.inst .inst-no{border:0;background:none;color:#8b929b;font-size:22px;line-height:1;padding:4px 4px 4px 0;flex:none}
body:has(.pie-act) .inst,body:has(.hoja:not(.cerrada)) .inst{display:none}
.pie-act{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 16px calc(10px + var(--safe-b));background:linear-gradient(transparent,var(--bg) 35%)}
.pie-act div{max-width:568px;margin:0 auto;display:flex;gap:8px}
.pie-act button{flex:1;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="velo oculto" id="velo"></div>
<div class="hoja cerrada" id="hoja" role="dialog" aria-modal="true" aria-labelledby="hojaTit"></div>
<div class="menu oculto" id="menu"></div>
<div class="inst oculto" id="inst" role="region" aria-label="Instalar Mi Ruta"></div>
<div class="toast oculto" id="toast" role="status"><span id="toastTxt"></span><button id="toastBtn" class="oculto">Deshacer</button></div>

const K={ses:'ruta_sesion',sel:'ruta_sel',cache:'ruta_cache_v1',cola:'ruta_cola_v1'};

const EST={
  'EN RUTA':        {cls:'EN_RUTA',        c:'var(--ruta)',ic:'→',d:'Todavía no llega al cliente'},
  'EN PROCESO':     {cls:'EN_PROCESO',     c:'var(--proc)',ic:'⏱',d:'Llegó y está atendiendo'},
  'TERMINADO':      {cls:'TERMINADO',      c:'var(--term)',ic:'✓',d:'Se entregó todo'},
  'ENTREGA PARCIAL':{cls:'ENTREGA_PARCIAL',c:'var(--parc)',ic:'◐',d:'Se entregó una parte, algo fue rechazado'},
  'ANULADO':        {cls:'ANULADO',        c:'var(--anul)',ic:'✕',d:'No se entregó: hay que indicar el motivo'}
};
const ORDEN_EST=['EN RUTA','EN PROCESO','TERMINADO','ENTREGA PARCIAL','ANULADO'];
const FINAL={'TERMINADO':1,'ENTREGA PARCIAL':1,'ANULADO':1};
const MOTIVOS=['Cliente cerrado','Cliente no recibe la mercadería','Dirección no ubicada','Fuera del horario de atención','Cliente reprogramó la entrega','Mercadería dañada'];

/* ---------- almacenamiento local (nunca debe tumbar la app) ---------- */
function leer(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function guardar(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function nubeUrl(){try{const u=localStorage.getItem('prove_nube_url');if(u&&/\/exec$/.test(u.trim()))return u.trim();}catch(e){}return NUBE_URL_DEFECTO;}

let ses=leer(K.ses,null);           // {usuario,clave,nombre}
let sel=leer(K.sel,{});             // {fechaDia,prog,placa}
let datos=leer(K.cache,null);       // respuesta de estadoRuta
let cola=leer(K.cola,[]);           // cambios por enviar
let srv={};                         // clave -> estado vigente en el servidor
let usuarioEscrito='', ultimoError='', filtro='pend', enviando=false, ultimaCarga=0, ultimaPos=null, menuAbierto=false;
if(datos)indexarServidor(datos.estados||[]);

/* ---------- utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function hoyLima(){return new Date(Date.now()-5*3600e3).toISOString().slice(0,10);}
function horaLima(ms){return new Date(ms).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Lima'});}
function hhmm(txt){return txt?String(txt).slice(11,16):'';}
function minutos(a,b){const x=Date.parse(String(a).replace(' ','T')),y=Date.parse(String(b).replace(' ','T'));return isNaN(x)||isNaN(y)?null:Math.round((y-x)/60000);}
function fechaLarga(iso){const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('es-PE',{weekday:'short',day:'numeric',month:'short'});}
function normPlaca(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function normCli(s){return String(s||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z0-9]/g,'');}
function titulo(s){return String(s||'').toLowerCase().replace(/(^|[\s\/.(-])([a-záéíóúñ])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(Sac|Eirl|Srl|Sa|Saa)\b/g,m=>m.toUpperCase());}
function facKey(p){return String(p.FACTURA||'').trim().toUpperCase()||('ID'+p.id);}
function claveDe(prog,p){return prog+'|'+facKey(p);}
function nuevoId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ---------- red ---------- */
async function pedir(cuerpo,ms){
  const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||25000);
  try{
    const r=await fetch(nubeUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(Object.assign({usuario:ses&&ses.usuario,clave:ses&&ses.clave},cuerpo)),signal:c.signal});
    if(!r.ok)throw new Error('el servidor respondió '+r.status);
    let j;try{j=await r.json();}catch(e){throw new Error('respuesta no válida del servidor');}
    return j;
  }catch(e){throw new Error(e.name==='AbortError'?'el servidor no respondió a tiempo':(/fetch|network|Failed/i.test(e.message)?'sin conexión':e.message));}
  finally{clearTimeout(t);}
}
function esAuth(msg){return /no autorizad/i.test(String(msg||''));}

/* ---------- estado de cada factura ---------- */
function indexarServidor(lista){srv={};(lista||[]).forEach(mezclarServidor);}
function mezclarServidor(e){
  const k=e.clave;if(!k)return;
  const p=srv[k];
  const tn=Math.max(+e.tsCliente||0,+e.tsOrden||0),tp=p?Math.max(+p.tsCliente||0,+p.tsOrden||0):-1;
  if(!p||tn>=tp)srv[k]=e;
}
/* lo pendiente en el celular manda sobre lo del servidor hasta que se envíe */
function estadoDe(clave){
  let ult=null;for(const c of cola)if(c.clave===clave&&!c.soloOrden&&(!ult||c.ts>=ult.ts))ult=c;
  const s=srv[clave];
  if(ult&&(!s||ult.ts>=(+s.tsCliente||0))){
    let lleg='';
    if(ult.estado!=='EN RUTA'){
      if(s&&s.horaLlegada&&s.estado!=='EN RUTA')lleg=s.horaLlegada;
      else{const pr=cola.filter(c=>c.clave===clave&&c.estado==='EN PROCESO').sort((x,y)=>x.ts-y.ts)[0];if(pr)lleg='~'+horaLima(pr.ts);}
    }
    return {estado:ult.estado,motivo:ult.motivo||'',detalle:ult.detalle||'',pend:true,horaLlegada:lleg,horaFin:FINAL[ult.estado]?'~'+horaLima(ult.ts):''};
  }
  if(s)return {estado:s.estado||'EN RUTA',motivo:s.motivo,detalle:s.detalle,horaLlegada:s.horaLlegada,horaFin:s.horaFin,pend:false};
  return {estado:'EN RUTA',pend:false};
}
/* orden de visita que puso el chofer (0 = todavía no lo puso) */
function ordenDe(clave){
  let ult=null;for(const c of cola)if(c.clave===clave&&c.orden!==undefined&&(!ult||c.ts>=ult.ts))ult=c;
  const s=srv[clave];
  if(ult&&(!s||ult.ts>=(+s.tsOrden||0)))return +ult.orden||0;
  return s?(+s.ordenVisita||0):0;
}
/* ¿el orden de esta factura ya fue confirmado? (lo pendiente en el celular cuenta) */
function confirmadoDe(clave){
  if(cola.some(c=>c.clave===clave&&c.confirmar))return true;
  const s=srv[clave];return !!(s&&(s.ordenConfirmado===true||s.ordenConfirmado==='SI'));
}
function horaCorta(h){if(!h)return '';return String(h).startsWith('~')?h.slice(1):hhmm(h);}

/* ---------- datos de la ruta seleccionada ---------- */
function progActual(){return datos&&datos.programaciones?datos.programaciones.find(p=>p.prog===sel.prog):null;}
function unidadActual(prog){prog=prog||progActual();if(!prog)return null;return prog.unidades.find(u=>normPlaca(u.placa)===normPlaca(sel.placa))||null;}
function paradasDe(prog,u){
  const ps=prog.pedidos.filter(p=>p.unitId===u.id).sort((a,b)=>(a.seq||999)-(b.seq||999)||a.id-b.id);
  const out=[];
  ps.forEach(p=>{
    const ult=out[out.length-1];
    if(ult&&ult.k===normCli(p.CLIENTES))ult.peds.push(p);
    else out.push({k:normCli(p.CLIENTES),peds:[p]});
  });
  out.forEach((s,i)=>{
    s.n=i+1;                                   // N° programado por el supervisor
    s.key=facKey(s.peds[0]);
    s.est=s.peds.map(p=>estadoDe(claveDe(prog.prog,p)));
    s.estado=estadoParada(s.est.map(e=>e.estado));
    const ords=s.peds.map(p=>ordenDe(claveDe(prog.prog,p))).filter(Boolean);
    s.orden=ords.length?Math.min(...ords):0;   // N° que puso el chofer
    s.conf=s.peds.some(p=>confirmadoDe(claveDe(prog.prog,p)));
  });
  /* primero las que el chofer ya numeró (1, 2, 3…), luego el resto en el orden programado */
  out.sort((a,b)=>(a.orden||1e6)-(b.orden||1e6)||a.n-b.n);
  return out;
}
function estadoParada(lista){
  if(lista.some(e=>e==='EN PROCESO'))return 'EN PROCESO';
  if(lista.every(e=>FINAL[e])){
    if(lista.every(e=>e==='ANULADO'))return 'ANULADO';
    if(lista.every(e=>e==='TERMINADO'))return 'TERMINADO';
    return 'ENTREGA PARCIAL';
  }
  if(lista.some(e=>FINAL[e]))return 'EN PROCESO';      // a medias: sigue en atención
  return 'EN RUTA';
}

/* ---------- carga desde el servidor ---------- */
async function cargar(dia,silencioso){
  dia=dia||sel.fechaDia||hoyLima();
  try{
    const r=await pedir({accion:'estadoRuta',fechaDia:dia},30000);
    if(!r.ok){
      if(esAuth(r.error)){cerrarSesion('Tu usuario o contraseña ya no son válidos. Vuelve a ingresar.');return false;}
      throw new Error(r.error||'respuesta inválida');
    }
    datos=r;ultimaCarga=Date.now();ultimoError='';
    indexarServidor(r.estados);
    guardar(K.cache,r);
    sel.fechaDia=r.fechaDia;
    elegirAutomatico();
    pintar();
    return true;
  }catch(e){
    ultimoError=e.message;
    if(!silencioso)toast('No se pudo actualizar la ruta: '+e.message,true);
    if(!datos)pintar();
    pintarSync(e.message);
    return false;
  }
}
/* el camión se elige solo si el usuario es la placa (ej. BVN766) o si ya se había elegido */
function elegirAutomatico(){
  const progs=(datos&&datos.programaciones)||[];
  const tiene=(p,pl)=>p.unidades.some(u=>normPlaca(u.placa)===normPlaca(pl));
  let placa=sel.placa;
  if(!placa||!progs.some(p=>tiene(p,placa))){
    const mia=normPlaca(ses&&ses.usuario);
    placa=null;
    for(const p of progs)for(const u of p.unidades)if(mia&&normPlaca(u.placa)===mia)placa=u.placa;
  }
  sel.placa=placa||null;
  if(placa){
    const suyas=progs.filter(p=>tiene(p,placa));
    if(!suyas.some(p=>p.prog===sel.prog)){
      /* turno por defecto: el primero que aún tenga algo por atender */
      const conPend=suyas.find(p=>paradasDe(p,p.unidades.find(u=>normPlaca(u.placa)===normPlaca(placa))).some(s=>!FINAL[s.estado]));
      sel.prog=(conPend||suyas[suyas.length-1]).prog;
    }
  }else sel.prog=null;
  guardar(K.sel,sel);
}

/* ---------- registrar un cambio ---------- */
function datosCambio(prog,u,p,ts){
  return {cid:nuevoId(),clave:claveDe(prog.prog,p),prog:prog.prog,fechaDia:prog.fechaDia,turno:prog.turno,
    placa:u.placa,ruta:u.ruta,personal:u.personal,seq:p.seq,factura:p.FACTURA||'',pedidoId:p.id,
    cliente:p.CLIENTES,distrito:p.DISTRITO,ts};
}
/* si el chofer atiende un cliente al que no le puso número, recibe el siguiente libre:
   así el orden de visita nunca queda vacío */
function autoOrden(prog,u,peds,ts){
  const par=paradasDe(prog,u);
  const tocadas=par.filter(s=>!s.orden&&s.peds.some(p=>peds.includes(p)));
  if(!tocadas.length)return;
  let max=par.reduce((m,s)=>Math.max(m,s.orden||0),0);
  tocadas.forEach(s=>{max++;s.peds.forEach(p=>cola.push(Object.assign(datosCambio(prog,u,p,ts),{soloOrden:true,orden:max})));});
}
function registrar(prog,u,peds,estado,motivo,detalle,conDeshacer){
  const ts=Date.now();const antes=[];
  if(estado!=='EN RUTA')autoOrden(prog,u,peds,ts);
  peds.forEach(p=>{
    const clave=claveDe(prog.prog,p);
    const prev=estadoDe(clave);
    antes.push({p,prev});
    cola.push({cid:nuevoId(),clave,prog:prog.prog,fechaDia:prog.fechaDia,turno:prog.turno,
      placa:u.placa,ruta:u.ruta,personal:u.personal,seq:p.seq,factura:p.FACTURA||'',pedidoId:p.id,
      cliente:p.CLIENTES,distrito:p.DISTRITO,estado,motivo:motivo||'',detalle:detalle||'',ts,
      lat:ultimaPos&&ts-ultimaPos.t<600000?ultimaPos.lat:null,lng:ultimaPos&&ts-ultimaPos.t<600000?ultimaPos.lng:null});
  });
  guardar(K.cola,cola);
  ubicar();
  pintar();
  programarEnvio(600);
  const txt=(peds.length>1?peds.length+' facturas':'Factura '+(peds[0].FACTURA||'sin número'))+': '+estado;
  if(conDeshacer)toast(txt,false,()=>{
    antes.forEach(a=>registrar(prog,u,[a.p],a.prev.estado,a.prev.motivo,a.prev.detalle,false));
    toast('Se deshizo el cambio');
  });else toast(txt);
}

/* ---------- envío (con cola si no hay señal) ---------- */
let tEnvio=null;
function programarEnvio(ms){clearTimeout(tEnvio);tEnvio=setTimeout(enviar,ms);}
async function enviar(){
  if(enviando||!cola.length||!ses)return;
  enviando=true;pintarSync();
  const lote=cola.slice(0,150);
  try{
    const r=await pedir({accion:'estadoGuardar',cambios:lote});
    if(!r.ok){
      if(esAuth(r.error)){enviando=false;cerrarSesion('Tu sesión ya no es válida. Ingresa de nuevo: los cambios pendientes se conservan.');return;}
      throw new Error(r.error||'respuesta inválida');
    }
    const listos=new Set([...(r.aceptados||[]),...(r.rechazados||[])].map(x=>x.cid));
    cola=cola.filter(c=>!listos.has(c.cid));guardar(K.cola,cola);
    (r.estados||[]).forEach(mezclarServidor);
    if(r.rechazados&&r.rechazados.length){
      const bloq=r.rechazados.some(x=>x.bloqueado);
      toast(bloq?'Otra persona ya confirmó el orden de este camión. Se muestra el orden vigente.':'El servidor no aceptó '+r.rechazados.length+' cambio(s): '+r.rechazados[0].error,true);
      if(bloq)setTimeout(()=>cargar(null,true),200);   // traer el orden que quedó confirmado
    }
    enviando=false;pintar();
    if(cola.length)programarEnvio(300);
  }catch(e){
    enviando=false;pintarSync(e.message);
    programarEnvio(20000);              // reintenta solo
  }
}

/* ---------- ubicación: se adjunta al cambio si el celular la da ---------- */
function ubicar(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(pos=>{
    ultimaPos={lat:+pos.coords.latitude.toFixed(6),lng:+pos.coords.longitude.toFixed(6),t:Date.now()};
    /* completa los cambios recientes que salieron sin ubicación y aún no se envían */
    let tocado=false;
    cola.forEach(c=>{if(c.lat==null&&Date.now()-c.ts<180000){c.lat=ultimaPos.lat;c.lng=ultimaPos.lng;tocado=true;}});
    if(tocado)guardar(K.cola,cola);
  },()=>{},{enableHighAccuracy:true,timeout:8000,maximumAge:120000});
}

/* =====================================================================
   ORDENAR MI RUTA: el chofer toca a sus clientes en el orden en que los
   visitará. El primero que toca es el 1, el siguiente el 2, y así.
   Tocar uno ya numerado le quita el número y los siguientes se recorren.
   ===================================================================== */
let ordenando=null;     // {prog, placa, lista:[key de parada]}
function empezarOrdenar(prog,u){
  const par=paradasDe(prog,u);
  if(par.some(s=>s.conf)){toast('El orden ya fue confirmado. Solo el supervisor puede cambiarlo.',true);return;}
  /* arranca con el orden que ya tenía, para que pueda corregir sin rehacer todo */
  ordenando={prog:prog.prog,placa:u.placa,lista:par.filter(s=>s.orden).sort((a,b)=>a.orden-b.orden).map(s=>s.key)};
  pintar();window.scrollTo(0,0);
}
function pintarOrdenar(prog,u,par){
  const lista=ordenando.lista.filter(k=>par.some(s=>s.key===k));
  ordenando.lista=lista;
  const porPrograma=par.slice().sort((a,b)=>a.n-b.n);
  const items=porPrograma.map(s=>{
    const i=lista.indexOf(s.key);const p0=s.peds[0];
    return `<button class="ord-item${i>=0?' on':''}" data-ok="${esc(s.key)}" aria-pressed="${i>=0}">
      <span class="ord-num">${i>=0?i+1:''}</span>
      <span class="tx"><b>${esc(titulo(p0.CLIENTES)||'Cliente sin nombre')}</b>
        <small>${esc(titulo(p0.DISTRITO))} · prog. ${s.n} · ${s.peds.length} factura${s.peds.length>1?'s':''}</small></span>
      ${s.estado!=='EN RUTA'?`<span class="est ${EST[s.estado].cls}">${esc(s.estado)}</span>`:''}</button>`;}).join('');
  const faltan=par.length-lista.length;
  app.innerHTML=cabecera(`<div class="camion"><span class="placa">${esc(u.placa||'')}</span><span class="placa-sub">Orden de visita</span></div><div style="height:12px"></div>`)+
    `<div class="ord-ayuda"><b>Toca a tus clientes en el orden en que los vas a visitar</b>El primero que toques será el 1, el siguiente el 2, y así. Si te equivocas, toca de nuevo para quitarle el número. Cuando lo confirmes quedará fijo: solo el supervisor podrá cambiarlo.</div>
     <div class="ord-lista">${items}</div>
     <div class="ord-pie"><div>
       <button class="btn-guardar" id="ordOk">${faltan&&lista.length?'Confirmar orden ('+lista.length+' de '+par.length+')':'Confirmar orden'}</button>
       <div class="fila"><button id="ordLimpiar">Empezar de nuevo</button><button id="ordNo">Cancelar</button></div>
     </div></div>`;
  app.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ok,i=ordenando.lista.indexOf(k);
    if(i>=0)ordenando.lista.splice(i,1);else ordenando.lista.push(k);
    pintar();
  });
  document.getElementById('ordLimpiar').onclick=()=>{ordenando.lista=[];pintar();};
  document.getElementById('ordNo').onclick=()=>{ordenando=null;pintar();};
  document.getElementById('ordOk').onclick=()=>guardarOrden(prog,u,par);
  enlazarCabecera();
}
function guardarOrden(prog,u,par){
  let lista=ordenando.lista.slice();
  if(!lista.length){toast('Toca a tus clientes en el orden en que los visitarás.',true);return;}
  const resto=par.filter(s=>!lista.includes(s.key)).sort((a,b)=>a.n-b.n);
  const aviso=(resto.length?'Te faltan '+resto.length+' cliente(s) por numerar: se pondrán al final, en el orden que programó el supervisor.\n\n':'')+
    '¿Confirmar este orden de visita?\nUna vez confirmado queda fijo: solo el supervisor podrá cambiarlo.';
  if(!confirm(aviso))return;
  lista=lista.concat(resto.map(s=>s.key));
  /* se envían TODAS las facturas con la confirmación, aunque su número no cambie:
     así cada una queda marcada como confirmada en la hoja */
  const ts=Date.now();
  lista.forEach((k,i)=>{
    const s=par.find(x=>x.key===k);if(!s)return;
    s.peds.forEach(p=>cola.push(Object.assign(datosCambio(prog,u,p,ts),{soloOrden:true,orden:i+1,confirmar:true})));
  });
  ordenando=null;
  guardar(K.cola,cola);programarEnvio(300);
  filtro='pend';pintar();window.scrollTo(0,0);
  toast('Orden de visita confirmado');
}

function tarjeta(s,esSig,idx){
  const p0=s.peds[0];
  const final=FINAL[s.estado];
  const compacta=final&&!esSig;
  const tipo=String(p0.TIPO||'').toUpperCase();
  const tipoCls=/PROV/.test(tipo)?'PROVINCIA':/RETIRO|RECOJ/.test(tipo)?'RETIRO':/LOCAL/.test(tipo)?'LOCAL':'';
  const comp=s.peds.reduce((a,p)=>a+(+p.comp||0),0),part=s.peds.reduce((a,p)=>a+(+p.partes||0),0);
  const obs=[...new Set(s.peds.map(p=>String(p.OBSERVACION||'').trim()).filter(Boolean))];
  const facs=s.peds.map((p,i)=>{const e=s.est[i];
    return `<button class="fac" data-par="${idx}" data-fac="${i}" aria-label="Cambiar estado de la factura ${esc(p.FACTURA||'sin número')}">
      <span class="fac-n">${esc(p.FACTURA||'Sin número de factura')}${e.pend?'<span class="pend-dot" title="Por enviar"></span>':''}
        ${e.estado==='ANULADO'&&e.motivo?`<small style="color:var(--anul)">Motivo: ${esc(e.motivo)}</small>`:''}
        ${e.estado==='ENTREGA PARCIAL'&&e.detalle?`<small style="color:var(--parc)">Rechazado: ${esc(e.detalle)}</small>`:''}</span>
      <span class="est ${EST[e.estado].cls}">${esc(e.estado)}</span><span class="flecha" aria-hidden="true">›</span></button>`;}).join('');
  const porHora=(x,y)=>horaCorta(x).localeCompare(horaCorta(y));
  const lleg=s.est.map(e=>e.horaLlegada).filter(Boolean).sort(porHora)[0];
  const fin=s.est.map(e=>e.horaFin).filter(Boolean).sort(porHora).slice(-1)[0];
  let horas='';
  if(lleg||fin){
    const dur=lleg&&fin&&!String(lleg).startsWith('~')&&!String(fin).startsWith('~')?minutos(lleg,fin):null;
    horas=`<div class="horas">${lleg?'Llegó '+horaCorta(lleg):''}${lleg&&fin?' · ':''}${fin?'terminó '+horaCorta(fin):''}${dur!=null&&dur>=0?' ('+dur+' min en el cliente)':''}</div>`;
  }
  const hayRuta=s.est.some(e=>e.estado==='EN RUTA');
  const hayProc=s.est.some(e=>e.estado==='EN PROCESO');
  const destino=p0.lat&&p0.lng?`${p0.lat},${p0.lng}`:encodeURIComponent((p0.CLIENTES||'')+' '+(p0.DISTRITO||'')+' Lima');
  const btnMapa=`<a href="https://www.google.com/maps/dir/?api=1&destination=${destino}" target="_blank" rel="noopener">📍 Cómo llegar</a>`;
  let acc='';
  if(!final){
    if(hayProc)acc=`<div class="acciones">${btnMapa}<button class="entregado" data-entregado="${idx}">✓ Entregado completo</button></div>`;
    else if(hayRuta)acc=`<div class="acciones">${btnMapa}<button class="llegue" data-llegue="${idx}">Llegué al cliente</button></div>`;
  }
  return `<div class="parada p-${EST[s.estado].cls}${esSig?' siguiente':''}${compacta?' compacta':''}">
    <div class="num${s.orden?'':' sin-orden'}" aria-label="${s.orden?'Orden de visita '+s.orden:'Sin orden de visita, programado '+s.n}">${s.orden||s.n}</div>
    <div class="tarjeta">
      ${esSig?`<span class="etq-sig">${s.estado==='EN PROCESO'?'Atendiendo ahora':'Siguiente parada'}</span>`:''}
      <div class="cli">${esc(titulo(p0.CLIENTES)||'Cliente sin nombre')}</div>
      <div class="meta">${esc(titulo(p0.DISTRITO))}${s.orden&&s.orden!==s.n?`<span class="prog-n" title="Orden en que lo programó el supervisor">prog. ${s.n}</span>`:''}${tipoCls?`<span class="tipo ${tipoCls}">${esc(titulo(tipoCls))}</span>`:''}${!compacta&&(comp||part)?` · ${comp} compl. + ${part} partes`:''}</div>
      ${!compacta&&obs.length?`<div class="obs">${obs.map(esc).join('<br>')}</div>`:''}
      <div class="facs">${facs}</div>${horas}${acc}
    </div></div>`;
}

/* ---------- hoja inferior: cambiar el estado de una factura ---------- */
let hojaCtx=null;
function abrirHoja(prog,u,s,p){
  const e=estadoDe(claveDe(prog.prog,p));
  hojaCtx={prog,u,s,p,actual:e.estado,elegido:null,motivo:e.estado==='ANULADO'?e.motivo||'':'',detalle:e.estado==='ENTREGA PARCIAL'?e.detalle||'':'',todas:false};
  pintarHoja();
  document.getElementById('velo').classList.remove('oculto');
  requestAnimationFrame(()=>document.getElementById('hoja').classList.remove('cerrada'));
  setTimeout(()=>{const b=document.querySelector('#hoja .opc');if(b)b.focus();},220);
}
function cerrarHoja(){
  document.getElementById('hoja').classList.add('cerrada');
  document.getElementById('velo').classList.add('oculto');
  hojaCtx=null;
}
function pintarHoja(){
  const h=hojaCtx,el=document.getElementById('hoja');
  const otras=h.s.peds.length>1;
  const ops=ORDEN_EST.map(e=>`<button class="opc${e===h.actual?' actual':''}${e===h.elegido?' marcada':''}" data-op="${esc(e)}">
      <span class="ic" style="background:${EST[e].c}">${EST[e].ic}</span><span><b>${esc(e)}</b><small>${esc(EST[e].d)}</small></span></button>`).join('');
  let extra='';
  if(h.elegido==='ANULADO'){
    extra=`<div class="campo"><label for="hMot">Motivo de la anulación <em>(obligatorio)</em></label>
      <div class="rapidos">${MOTIVOS.map(m=>`<button data-mot="${esc(m)}">${esc(m)}</button>`).join('')}</div>
      <textarea id="hMot" maxlength="500" placeholder="Escribe por qué se anula el envío">${esc(h.motivo)}</textarea></div>`;
  }else if(h.elegido==='ENTREGA PARCIAL'){
    extra=`<div class="campo"><label for="hDet">¿Qué se rechazó? <em>(opcional)</em></label>
      <textarea id="hDet" maxlength="500" placeholder="Ej. 2 sillas con el tapiz rasgado">${esc(h.detalle)}</textarea></div>`;
  }
  const necesitaGuardar=h.elegido==='ANULADO'||h.elegido==='ENTREGA PARCIAL';
  el.innerHTML=`<div class="asa"></div><h3 id="hojaTit">Factura ${esc(h.p.FACTURA||'sin número')}</h3>
    <div class="sub">${esc(titulo(h.p.CLIENTES))} · parada ${h.s.n}</div>
    <div class="opciones">${ops}</div>${extra}
    ${otras?`<label class="todas"><input type="checkbox" id="hTodas" ${h.todas?'checked':''}> Aplicar a las ${h.s.peds.length} facturas de esta parada</label>`:''}
    ${necesitaGuardar?`<button class="btn-guardar" id="hOk">Guardar ${esc(h.elegido.toLowerCase())}</button>`:''}
    <button class="btn-sec" id="hNo">Cancelar</button>`;
  el.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>elegir(b.dataset.op));
  el.querySelectorAll('[data-mot]').forEach(b=>b.onclick=()=>{
    const t=document.getElementById('hMot');t.value=t.value.trim()?t.value.trim()+'. '+b.dataset.mot:b.dataset.mot;h.motivo=t.value;t.classList.remove('falta');});
  const tm=document.getElementById('hMot');if(tm)tm.oninput=()=>{h.motivo=tm.value;tm.classList.remove('falta');};
  const td=document.getElementById('hDet');if(td)td.oninput=()=>{h.detalle=td.value;};
  const tt=document.getElementById('hTodas');if(tt)tt.onchange=()=>{h.todas=tt.checked;};
  const ok=document.getElementById('hOk');if(ok)ok.onclick=confirmarHoja;
  document.getElementById('hNo').onclick=cerrarHoja;
}
function elegir(e){
  const h=hojaCtx;
  if(e==='ANULADO'||e==='ENTREGA PARCIAL'){
    h.elegido=e;pintarHoja();
    const t=document.getElementById(e==='ANULADO'?'hMot':'hDet');if(t)t.focus();
    return;
  }
  h.elegido=e;confirmarHoja();
}
function confirmarHoja(){
  const h=hojaCtx;if(!h||!h.elegido)return;
  const e=h.elegido;
  if(e==='ANULADO'&&!String(h.motivo||'').trim()){
    const t=document.getElementById('hMot');t.classList.add('falta');t.focus();toast('Escribe el motivo de la anulación.',true);return;
  }
  const peds=h.todas?h.s.peds:[h.p];
  const cambian=peds.filter(p=>{const x=estadoDe(claveDe(h.prog.prog,p));
    return x.estado!==e||(e==='ANULADO'&&x.motivo!==h.motivo.trim())||(e==='ENTREGA PARCIAL'&&x.detalle!==h.detalle.trim());});
  if(!cambian.length){cerrarHoja();toast('Ya tenía ese estado.');return;}
  const prog=h.prog,u=h.u;
  cerrarHoja();
  registrar(prog,u,cambian,e,e==='ANULADO'?h.motivo.trim():'',e==='ENTREGA PARCIAL'?h.detalle.trim():'',true);
}
document.getElementById('velo').onclick=cerrarHoja;
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(hojaCtx)cerrarHoja();cerrarMenu();}});

/* ---------- cabecera: sincronización y menú ---------- */
function pintarSync(error){
  const b=document.getElementById('sync');if(!b)return;
  const n=cola.length;
  b.className='sync'+(enviando?' envia':n&&error?' err':n?' pend':'');
  b.innerHTML='<i></i>'+(enviando?'Enviando…':n?(error?'Sin señal · '+n+' por enviar':n+' por enviar'):(ultimaCarga?'Al día '+horaLima(ultimaCarga):'Al día'));
  b.title=error?('Último intento: '+error):'Toca para actualizar';
}
function enlazarCabecera(){
  pintarSync();
  const s=document.getElementById('sync');if(s)s.onclick=()=>{enviar();cargar(null,false);};
  const m=document.getElementById('mBtn');if(m)m.onclick=ev=>{ev.stopPropagation();menuAbierto?cerrarMenu():abrirMenu();};
}
function abrirMenu(){
  const m=document.getElementById('menu');menuAbierto=true;
  const prM=progActual(),unM=unidadActual(prM);
  const puedeOrdenar=!!(prM&&unM)&&!paradasDe(prM,unM).some(s=>s.conf);
  m.innerHTML=`<button id="mAct">Actualizar ruta</button>${puedeOrdenar?'<button id="mOrd">Ordenar mi ruta</button>':''}<button id="mCam">Cambiar de camión</button>
    <button id="mDia">Ver otro día</button>${instalada()?'':'<button id="mIns">📲 Instalar la app</button>'}<button id="mSal">Cerrar sesión</button>
    <div class="ver">${esc(ses&&ses.usuario||'')} · versión ${esc(APP_VERSION)}</div>${FIRMA}`;
  m.classList.remove('oculto');
  document.getElementById('mAct').onclick=()=>{cerrarMenu();enviar();cargar(null,false);};
  const bOrd=document.getElementById('mOrd');if(bOrd)bOrd.onclick=()=>{cerrarMenu();const pr=progActual(),un=unidadActual(pr);if(pr&&un)empezarOrdenar(pr,un);};
  document.getElementById('mCam').onclick=()=>{cerrarMenu();ordenando=null;sel.prog=null;sel.placa=null;guardar(K.sel,sel);pintarSeleccion();};
  document.getElementById('mDia').onclick=()=>{
    cerrarMenu();
    const d=prompt('Fecha a revisar (dd/mm/aaaa). Deja vacío para hoy:','');
    if(d===null)return;
    let iso=hoyLima();
    const mm=String(d).trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if(mm){let y=+mm[3];if(y<100)y+=2000;iso=y+'-'+String(mm[2]).padStart(2,'0')+'-'+String(mm[1]).padStart(2,'0');}
    else if(String(d).trim()){toast('Escribe la fecha como 20/10/2026.',true);return;}
    sel.fechaDia=iso;sel.prog=null;guardar(K.sel,sel);cargar(iso,false);
  };
  const bIns=document.getElementById('mIns');if(bIns)bIns.onclick=()=>{cerrarMenu();instalarApp();};
  document.getElementById('mSal').onclick=()=>{
    cerrarMenu();
    if(cola.length&&!confirm('Hay '+cola.length+' cambio(s) sin enviar. Se conservan en este celular y se enviarán cuando vuelvas a ingresar. ¿Cerrar sesión?'))return;
    cerrarSesion();
  };
}
function cerrarMenu(){menuAbierto=false;const m=document.getElementById('menu');if(m)m.classList.add('oculto');}
document.addEventListener('click',ev=>{if(menuAbierto&&!ev.target.closest('#menu'))cerrarMenu();});
function cerrarSesion(msg){
  const u=ses&&ses.usuario;ses=null;
  try{localStorage.removeItem(K.ses);}catch(e){}
  if(u)guardar('ruta_ultimo_usuario',u);
  pintarLogin(msg);
}

/* ---------- aviso flotante con "Deshacer" ---------- */
let tToast=null;
function toast(txt,err,deshacer){
  const t=document.getElementById('toast'),b=document.getElementById('toastBtn');
  document.getElementById('toastTxt').textContent=txt;
  t.classList.toggle('err',!!err);t.classList.remove('oculto');
  if(deshacer){b.classList.remove('oculto');b.onclick=()=>{t.classList.add('oculto');deshacer();};}
  else{b.classList.add('oculto');b.onclick=null;}
  clearTimeout(tToast);tToast=setTimeout(()=>t.classList.add('oculto'),deshacer?6000:err?5000:2500);
}

/* ---------- se mantiene al día solo ---------- */
setInterval(()=>{if(ses&&!document.hidden&&!hojaCtx&&Date.now()-ultimaCarga>90000)cargar(null,true);},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ses){enviar();if(Date.now()-ultimaCarga>45000)cargar(null,true);}});
window.addEventListener('online',()=>{enviar();if(ses)cargar(null,true);});
window.addEventListener('offline',()=>pintarSync('sin conexión'));

/* ---------- actualización automática del archivo (igual que el planificador) ---------- */
async function revisarVersion(){
  if(location.protocol==='file:')return;
  try{
    const base=location.origin+location.pathname;
    const r=await fetch(base+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=(await r.text()).match(/const APP_VERSION\s*=\s*'([^']+)'/);
    if(!m||m[1]===APP_VERSION)return;
    const k='prove_upd_'+(location.pathname.split('/').pop()||'ruta');
    if(sessionStorage.getItem(k)===m[1])return;
    sessionStorage.setItem(k,m[1]);
    if(cola.length)guardar(K.cola,cola);
    location.replace(base+'?v='+encodeURIComponent(m[1]));
  }catch(e){}
}

/* ---------- app instalable ----------
   El manifiesto (ruta.webmanifest) y el service worker (ruta-sw.js) son
   archivos aparte, junto a ruta.html: Chrome solo ofrece "Instalar" si los
   encuentra como archivos. El service worker controla SOLO ruta.html
   (scope ./ruta.html); el planificador, en la misma carpeta, no se toca.
   La página siempre se pide a la red primero (las versiones nuevas llegan
   solas) y la copia guardada solo se usa si no hay señal. */
let pedidoInstalar=null;
function instalada(){
  return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
}
function esIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)&&!/crios|fxios/i.test(navigator.userAgent);}
function tarjetaInstalar(mostrar){
  const t=document.getElementById('inst');if(!t)return;
  const pospuesto=+leer('ruta_inst_no',0);
  if(!mostrar||instalada()||Date.now()-pospuesto<3*864e5){t.classList.add('oculto');document.body.classList.remove('con-inst');return;}
  t.innerHTML=`${simbolo('')}<div><b>Instala Mi Ruta</b><small>${esIOS()?'Toca Compartir y luego «Agregar a inicio».':'Ábrela desde la pantalla de inicio, sin buscar el enlace.'}</small></div>
    ${esIOS()?'':'<button class="inst-si" id="instSi">Instalar</button>'}<button class="inst-no" id="instNo" aria-label="Ahora no">×</button>`;
  t.classList.remove('oculto');document.body.classList.add('con-inst');
  const si=document.getElementById('instSi');if(si)si.onclick=instalarApp;
  document.getElementById('instNo').onclick=()=>{guardar('ruta_inst_no',Date.now());tarjetaInstalar(false);};
}
async function instalarApp(){
  if(instalada()){toast('Mi Ruta ya está instalada en este celular.');return;}
  if(!pedidoInstalar){
    toast(esIOS()?'En Safari toca Compartir y luego «Agregar a inicio».':'Abre el menú ⋮ del navegador y elige «Instalar aplicación» o «Agregar a pantalla de inicio».');
    return;
  }
  const p=pedidoInstalar;pedidoInstalar=null;
  p.prompt();
  let r=null;try{r=await p.userChoice;}catch(e){}
  tarjetaInstalar(false);
  if(r&&r.outcome==='accepted')toast('Listo. Mi Ruta queda en tu pantalla de inicio.');
}
window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();pedidoInstalar=ev;tarjetaInstalar(true);});
window.addEventListener('appinstalled',()=>{pedidoInstalar=null;tarjetaInstalar(false);});
if(esIOS()&&!instalada())setTimeout(()=>tarjetaInstalar(true),1500);
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('ruta-sw.js',{scope:'./ruta.html'}).catch(()=>{});});
}

/* ---------- arranque ---------- */
/* un día nuevo empieza en la ruta de hoy, no en la que quedó guardada de ayer */
if(sel.fechaDia&&sel.fechaDia!==hoyLima()){sel.fechaDia=hoyLima();sel.prog=null;guardar(K.sel,sel);}
if(datos&&datos.fechaDia!==(sel.fechaDia||hoyLima()))datos=null;
pintar();
if(ses){cargar(sel.fechaDia||hoyLima(),true);ubicar();programarEnvio(500);}
revisarVersion();setInterval(revisarVersion,1800000);
</script>
